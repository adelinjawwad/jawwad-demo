<!DOCTYPE html>
<html lang="en" >
	<head>
		<meta charset="UTF-8" />
		<title>Download</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			body {
			background: #0f0f0f;
			color: white;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			user-select: none;
			text-align: center;
			}
			.loader {
			width: 60px;
			height: 6px;
			background: #444;
			border-radius: 3px;
			overflow: hidden;
			margin-bottom: 24px;
			position: relative;
			}
			.loader::before {
			content: '';
			position: absolute;
			left: -40%;
			top: 0;
			height: 100%;
			width: 40%;
			background: #4ade80;
			border-radius: 3px;
			animation: slide 1.5s linear infinite;
			}
			@keyframes slide {
			0% { left: -40%; }
			100% { left: 100%; }
			}
			.message {
			font-size: 1.25rem;
			margin-bottom: 12px;
			color: #ccc;
			}
			.countdown {
			font-size: 3.5rem;
			font-weight: 600;
			color: #4ade80;
			margin-bottom: 40px;
			user-select: none;
			}
			.complete-message {
			display: flex;
			align-items: center;
			font-size: 1.5rem;
			color: #4ade80;
			gap: 10px;
			user-select: none;
			}
			.checkmark {
			width: 24px;
			height: 24px;
			stroke: #4ade80;
			stroke-width: 3;
			stroke-linecap: round;
			stroke-linejoin: round;
			fill: none;
			}
		</style>
	</head>
	<body>
		<div id="loader" class="loader"></div>
		<div id="message" class="message">Your download will start in</div>
		<div id="countdown" class="countdown">3</div>
		<script>
			const fileName = new URLSearchParams(window.location.search).get('file');
			const messageEl = document.getElementById('message');
			const countdownEl = document.getElementById('countdown');
			const loaderEl = document.getElementById('loader');
			
			if (!fileName) {
			  loaderEl.style.display = 'none';
			  messageEl.textContent = "Missing file parameter in URL.";
			  countdownEl.style.display = 'none';
			} else {
			  let counter = 3;
			
			  const interval = setInterval(() => {
			    counter--;
			
			    if (counter > 0) {
			      countdownEl.textContent = counter;
			    } else if (counter === 0) {
			      // hide loader and countdown
			      loaderEl.style.display = 'none';
			      countdownEl.style.display = 'none';
			      messageEl.style.display = 'none';
			
			      // show complete message
			      const completeMsg = document.createElement('div');
			      completeMsg.classList.add('complete-message');
			      completeMsg.innerHTML = `
			        <svg class="checkmark" viewBox="0 0 24 24">
			          <polyline points="20 6 9 17 4 12"></polyline>
			        </svg>
			        Your download is complete, see you next time!
			      `;
			      document.body.appendChild(completeMsg);
			    } else if (counter === -1) {
			      clearInterval(interval);
			      const downloadUrl = `https://adelinjawwad.github.io/jawwad-demo/assets/downloads/${fileName}`;
			      const a = document.createElement('a');
			      a.href = downloadUrl;
			      a.download = fileName;
			      document.body.appendChild(a);
			      a.click();
			      document.body.removeChild(a);
			    }
			  }, 1000);
			}
		</script>
	</body>
</html>
