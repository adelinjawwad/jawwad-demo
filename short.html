<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Preparing Download</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
		<style>
			* {
			box-sizing: border-box;
			margin: 0;
			padding: 0;
			}
			body {
			background: radial-gradient(circle at top left, #1a1a1a, #0f0f0f);
			color: #f0f0f0;
			font-family: 'Poppins', sans-serif;
			height: 100vh;
			display: flex;
			justify-content: center;
			align-items: center;
			padding: 2rem;
			}
			.container {
			text-align: center;
			background: #1c1c1c;
			padding: 2rem;
			border-radius: 20px;
			max-width: 400px;
			width: 100%;
			box-shadow: 0 0 40px rgba(0, 0, 0, 0.5);
			}
			.loader {
			position: relative;
			width: 100%;
			height: 12px;
			border-radius: 8px;
			background: #2f2f2f;
			overflow: hidden;
			margin: 2rem 0;
			}
			.loader::before {
			content: '';
			position: absolute;
			height: 100%;
			width: 40%;
			background: linear-gradient(to right, #4ade80, #22c55e);
			border-radius: 8px;
			animation: slide 1.5s infinite;
			}
			@keyframes slide {
			0% { left: -40%; }
			100% { left: 100%; }
			}
			.message {
			font-size: 1rem;
			color: #aaa;
			margin-bottom: 10px;
			transition: all 0.3s ease;
			}
			.countdown {
			font-size: 3rem;
			font-weight: 600;
			color: #4ade80;
			animation: pulse 1s infinite;
			}
			@keyframes pulse {
			0%, 100% { transform: scale(1); opacity: 1; }
			50% { transform: scale(1.1); opacity: 0.6; }
			}
			.complete-message {
			display: flex;
			align-items: center;
			justify-content: center;
			gap: 10px;
			font-size: 1.25rem;
			font-weight: 500;
			color: #4ade80;
			}
			.checkmark {
			width: 24px;
			height: 24px;
			stroke: #4ade80;
			stroke-width: 3;
			stroke-linecap: round;
			stroke-linejoin: round;
			fill: none;
			}
			@media (max-width: 480px) {
			.container {
			padding: 1.5rem;
			}
			.countdown {
			font-size: 2.5rem;
			}
			.complete-message {
			font-size: 1rem;
			}
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div id="loader" class="loader"></div>
			<div id="message" class="message">Preparing your download. Starting in</div>
			<div id="countdown" class="countdown">3</div>
		</div>
		<script>
			const fileName = new URLSearchParams(window.location.search).get('file');
			const messageEl = document.getElementById('message');
			const countdownEl = document.getElementById('countdown');
			const loaderEl = document.getElementById('loader');
			
			if (!fileName) {
			  loaderEl.style.display = 'none';
			  messageEl.textContent = "Error: Missing file parameter.";
			  countdownEl.style.display = 'none';
			} else {
			  let counter = 3;
			  const interval = setInterval(() => {
			    counter--;
			
			    if (counter > 0) {
			      countdownEl.textContent = counter;
			    } else if (counter === 0) {
			      loaderEl.style.display = 'none';
			      countdownEl.style.display = 'none';
			      messageEl.style.display = 'none';
			
			      const completeMsg = document.createElement('div');
			      completeMsg.classList.add('complete-message');
			      completeMsg.innerHTML = `
			        <svg class="checkmark" viewBox="0 0 24 24">
			          <polyline points="20 6 9 17 4 12" />
			        </svg>
			        Download started. Thank you!
			      `;
			      document.querySelector('.container').appendChild(completeMsg);
			    } else if (counter === -1) {
			      clearInterval(interval);
			      const downloadUrl = `https://adelinjawwad.github.io/jawwad-demo/assets/downloads/${fileName}`;
			      const a = document.createElement('a');
			      a.href = downloadUrl;
			      a.download = fileName;
			      document.body.appendChild(a);
			      a.click();
			      document.body.removeChild(a);
			    }
			  }, 1000);
			}
		</script>
	</body>
</html>
