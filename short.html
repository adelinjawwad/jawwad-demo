<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>🚀 Preparing Download - Jawwad ART</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #ec4899;
            --secondary: #8b5cf6;
            --accent: #06d6a0;
            --success: #10b981;
            --bg-dark: #0f0f23;
            --bg-card: #1a1a2e;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
        }

        body {
            background: linear-gradient(135deg, var(--bg-dark) 0%, #16213e 50%, var(--bg-dark) 100%);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            overflow: hidden;
            position: relative;
        }

        /* Animated Background */
        .bg-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 0;
        }

        .floating-shapes {
            position: absolute;
            width: 100%;
            height: 100%;
        }

        .shape {
            position: absolute;
            background: linear-gradient(45deg, var(--primary), var(--secondary));
            border-radius: 50%;
            opacity: 0.1;
            animation: float 20s infinite linear;
        }

        .shape:nth-child(1) { width: 80px; height: 80px; left: 10%; animation-delay: 0s; }
        .shape:nth-child(2) { width: 120px; height: 120px; left: 20%; animation-delay: 2s; }
        .shape:nth-child(3) { width: 60px; height: 60px; left: 70%; animation-delay: 4s; }
        .shape:nth-child(4) { width: 100px; height: 100px; left: 80%; animation-delay: 6s; }
        .shape:nth-child(5) { width: 140px; height: 140px; left: 50%; animation-delay: 8s; }

        @keyframes float {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-100vh) rotate(360deg); }
        }

        /* Main Container */
        .container {
            text-align: center;
            background: rgba(26, 26, 46, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 3rem 2rem;
            border-radius: 24px;
            max-width: 500px;
            width: 100%;
            box-shadow: var(--shadow);
            position: relative;
            z-index: 10;
            transform: scale(0.9);
            animation: containerEntry 0.8s ease-out forwards;
        }

        @keyframes containerEntry {
            to {
                transform: scale(1);
            }
        }

        /* Header */
        .header {
            margin-bottom: 2rem;
        }

        .logo {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 2rem;
            animation: logoSpin 2s ease-in-out infinite alternate;
            box-shadow: 0 10px 30px rgba(236, 72, 153, 0.3);
        }

        @keyframes logoSpin {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(15deg); }
        }

        .title {
            font-size: 1.75rem;
            font-weight: 700;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 0.95rem;
            font-weight: 400;
        }

        /* File Info */
        .file-info {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            margin: 2rem 0;
            backdrop-filter: blur(10px);
        }

        .file-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 0.5rem;
            word-break: break-all;
        }

        .file-size {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Progress Section */
        .progress-section {
            margin: 2rem 0;
        }

        .progress-container {
            position: relative;
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin: 1.5rem 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--secondary), var(--accent));
            background-size: 200% 100%;
            border-radius: 10px;
            width: 0%;
            transition: width 0.3s ease;
            animation: progressShimmer 2s infinite;
            position: relative;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.4), transparent);
            animation: progressGlow 1.5s infinite;
        }

        @keyframes progressShimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        @keyframes progressGlow {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        /* Countdown */
        .countdown-section {
            margin: 2rem 0;
        }

        .countdown-label {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-bottom: 1rem;
            opacity: 0;
            animation: fadeInUp 0.6s ease-out 0.3s forwards;
        }

        .countdown {
            font-size: 4rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: countdownPulse 1s infinite, fadeInUp 0.6s ease-out 0.5s both;
            text-shadow: 0 0 30px rgba(236, 72, 153, 0.5);
        }

        @keyframes countdownPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Success State */
        .success-container {
            display: none;
            animation: successEntry 0.8s ease-out;
        }

        @keyframes successEntry {
            0% {
                opacity: 0;
                transform: scale(0.8) translateY(20px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, var(--success), var(--accent));
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 3rem;
            color: white;
            animation: successBounce 0.6s ease-out;
            box-shadow: 0 15px 40px rgba(16, 185, 129, 0.4);
        }

        @keyframes successBounce {
            0% { transform: scale(0); }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); }
        }

        .success-message {
            font-size: 1.5rem;
            font-weight: 600;
            color: var(--success);
            margin-bottom: 1rem;
        }

        .success-subtitle {
            color: var(--text-secondary);
            font-size: 1rem;
        }

        /* Error State */
        .error-container {
            display: none;
        }

        .error-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #ef4444, #dc2626);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1.5rem;
            font-size: 2rem;
            color: white;
            animation: errorShake 0.5s ease-out;
        }

        @keyframes errorShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .error-message {
            font-size: 1.25rem;
            font-weight: 600;
            color: #ef4444;
            margin-bottom: 0.5rem;
        }

        .error-subtitle {
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        /* Particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--primary);
            border-radius: 50%;
            opacity: 0.6;
            animation: particleFloat 8s infinite linear;
        }

        @keyframes particleFloat {
            0% {
                transform: translateY(100vh) translateX(0) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.6;
            }
            90% {
                opacity: 0.6;
            }
            100% {
                transform: translateY(-10vh) translateX(100px) rotate(360deg);
                opacity: 0;
            }
        }

        /* Responsive */
        @media (max-width: 480px) {
            .container {
                padding: 2rem 1.5rem;
                margin: 1rem;
            }
            
            .countdown {
                font-size: 3rem;
            }
            
            .title {
                font-size: 1.5rem;
            }
            
            .logo {
                width: 60px;
                height: 60px;
                font-size: 1.5rem;
            }
        }

        /* Loading dots animation */
        .loading-dots {
            display: inline-block;
        }

        .loading-dots::after {
            content: '';
            animation: loadingDots 1.5s infinite;
        }

        @keyframes loadingDots {
            0%, 20% { content: ''; }
            40% { content: '.'; }
            60% { content: '..'; }
            80%, 100% { content: '...'; }
        }
    </style>
</head>
<body>
    <!-- Animated Background -->
    <div class="bg-animation">
        <div class="floating-shapes">
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
            <div class="shape"></div>
        </div>
    </div>

    <!-- Particles -->
    <div class="particles" id="particles"></div>

    <!-- Main Container -->
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="logo">
                <i class="fas fa-download"></i>
            </div>
            <h1 class="title">Preparing Download</h1>
            <p class="subtitle">Your file will start downloading shortly</p>
        </div>

        <!-- File Info -->
        <div class="file-info" id="fileInfo" style="display: none;">
            <div class="file-name" id="fileName"></div>
            <div class="file-size">Estimated size: <span id="fileSize">Calculating...</span></div>
        </div>

        <!-- Loading State -->
        <div id="loadingState">
            <!-- Progress Section -->
            <div class="progress-section">
                <div class="progress-container">
                    <div class="progress-bar" id="progressBar"></div>
                </div>
            </div>

            <!-- Countdown -->
            <div class="countdown-section">
                <div class="countdown-label">Starting download in<span class="loading-dots"></span></div>
                <div class="countdown" id="countdown">3</div>
            </div>
        </div>

        <!-- Success State -->
        <div class="success-container" id="successState">
            <div class="success-icon">
                <i class="fas fa-check"></i>
            </div>
            <div class="success-message">Download Started!</div>
            <div class="success-subtitle">Thank you for choosing Jawwad ART</div>
        </div>

        <!-- Error State -->
        <div class="error-container" id="errorState">
            <div class="error-icon">
                <i class="fas fa-exclamation-triangle"></i>
            </div>
            <div class="error-message">Download Failed</div>
            <div class="error-subtitle" id="errorText">Please try again later</div>
        </div>
    </div>

    <script>
        // Get file parameter
        const fileName = new URLSearchParams(window.location.search).get('file');
        
        // DOM elements
        const loadingState = document.getElementById('loadingState');
        const successState = document.getElementById('successState');
        const errorState = document.getElementById('errorState');
        const fileInfo = document.getElementById('fileInfo');
        const fileNameEl = document.getElementById('fileName');
        const fileSizeEl = document.getElementById('fileSize');
        const countdownEl = document.getElementById('countdown');
        const progressBar = document.getElementById('progressBar');
        const particlesContainer = document.getElementById('particles');

        // Create particles
        function createParticles() {
            for (let i = 0; i < 20; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                particle.style.left = Math.random() * 100 + '%';
                particle.style.animationDelay = Math.random() * 8 + 's';
                particle.style.animationDuration = (Math.random() * 3 + 5) + 's';
                particlesContainer.appendChild(particle);
            }
        }

        // Simulate file size calculation
        function simulateFileSize() {
            const sizes = ['2.4 MB', '1.8 MB', '3.1 MB', '5.2 MB', '1.2 MB', '4.7 MB'];
            return sizes[Math.floor(Math.random() * sizes.length)];
        }

        // Progress bar animation
        function animateProgress() {
            let progress = 0;
            const interval = setInterval(() => {
                progress += Math.random() * 15 + 5;
                if (progress > 100) progress = 100;
                
                progressBar.style.width = progress + '%';
                
                if (progress >= 100) {
                    clearInterval(interval);
                }
            }, 200);
        }

        // Main download logic
        function startDownload() {
            if (!fileName) {
                showError('Missing file parameter');
                return;
            }

            // Show file info
            fileNameEl.textContent = fileName;
            fileSizeEl.textContent = simulateFileSize();
            fileInfo.style.display = 'block';

            // Start animations
            createParticles();
            animateProgress();

            // Countdown
            let counter = 3;
            const interval = setInterval(() => {
                counter--;

                if (counter > 0) {
                    countdownEl.textContent = counter;
                } else if (counter === 0) {
                    // Show success state
                    loadingState.style.display = 'none';
                    successState.style.display = 'block';
                    
                    // Trigger download
                    setTimeout(() => {
                        const downloadUrl = `https://adelinjawwad.github.io/jawwad-demo/assets/downloads/${fileName}`;
                        const a = document.createElement('a');
                        a.href = downloadUrl;
                        a.download = fileName;
                        document.body.appendChild(a);
                        a.click();
                        document.body.removeChild(a);
                    }, 500);
                    
                    clearInterval(interval);
                }
            }, 1000);
        }

        function showError(message) {
            loadingState.style.display = 'none';
            errorState.style.display = 'block';
            document.getElementById('errorText').textContent = message;
        }

        // Add some sound effects (optional)
        function playSound(type) {
            // You can add Web Audio API sounds here
            // For now, we'll use a simple beep simulation
            if (type === 'success') {
                // Success sound simulation
                console.log('🔊 Success sound played');
            }
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            startDownload();
        });

        // Add some easter eggs
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                // Space bar creates extra particles
                for (let i = 0; i < 5; i++) {
                    const particle = document.createElement('div');
                    particle.className = 'particle';
                    particle.style.left = Math.random() * 100 + '%';
                    particle.style.background = '#06d6a0';
                    particlesContainer.appendChild(particle);
                    
                    setTimeout(() => {
                        particle.remove();
                    }, 8000);
                }
            }
        });
    </script>
</body>
</html>
