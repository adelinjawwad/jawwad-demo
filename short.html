<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Redirecting...</title>
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<style>
			body {
			background: #0f0f0f;
			color: #eee;
			font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
			display: flex;
			flex-direction: column;
			justify-content: center;
			align-items: center;
			height: 100vh;
			margin: 0;
			text-align: center;
			padding: 20px;
			}
			h1 {
			font-weight: 700;
			font-size: 2rem;
			margin-bottom: 0.5rem;
			}
			p {
			font-size: 1.1rem;
			margin-top: 0;
			margin-bottom: 1rem;
			color: #bbb;
			}
			.loader {
			border: 4px solid #222;
			border-top: 4px solid #ff4081;
			border-radius: 50%;
			width: 40px;
			height: 40px;
			animation: spin 1s linear infinite;
			margin: 0 auto 2rem auto;
			}
			@keyframes spin {
			0% { transform: rotate(0deg);}
			100% { transform: rotate(360deg);}
			}
			.countdown {
			font-size: 1.2rem;
			font-weight: 600;
			color: #ff4081;
			margin-top: 0;
			}
			.error {
			color: #ff5555;
			font-weight: 600;
			font-size: 1.5rem;
			}
		</style>
	</head>
	<body>
		<div id="content">
			<h1>Preparing your download...</h1>
			<p>Your file will start downloading in <span id="countdown">3</span> seconds.</p>
			<div class="loader" aria-label="Loading spinner"></div>
		</div>
		<script>
			const fileName = new URLSearchParams(window.location.search).get('file');
			const countdownEl = document.getElementById('countdown');
			
			if (fileName) {
			  let counter = 3;
			  const interval = setInterval(() => {
			    counter--;
			    if (counter <= 0) {
			      clearInterval(interval);
			      const downloadUrl = `https://adelinjawwad.github.io/jawwad-demo/assets/downloads/${fileName}`;
			      window.location.href = downloadUrl;
			    } else {
			      countdownEl.textContent = counter;
			    }
			  }, 1000);
			} else {
			  const content = document.getElementById('content');
			  content.innerHTML = '<h1 class="error">Missing file parameter in URL.</h1>';
			}
		</script>
	</body>
</html>
