<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<title>Redirecting...</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<script>
			// Ia parametrul "file" din URL
			const fileName = new URLSearchParams(window.location.search).get('file');
			
			if (fileName) {
			  // Construiește linkul complet spre folderul de downloads
			  const downloadUrl = `https://adelinjawwad.github.io/jawwad-demo/assets/downloads/${fileName}`;
			  window.location.href = downloadUrl;
			} else {
			  document.write('<h1 style="color: white; text-align: center; margin-top: 2rem;">Missing file parameter in URL.</h1>');
			}
		</script>
		<style>
			body {
			background: #0f0f0f;
			font-family: sans-serif;
			}
		</style>
	</head>
	<body></body>
</html>
