<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Download</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2.11.1/tsparticles.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0f0f0f;
      color: white;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    #tsparticles {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .content {
      position: relative;
      z-index: 1;
    }

    .loader-bar {
      width: 200px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 30px;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #4ade80, #34d399);
      transition: width 1s ease;
    }

    .message {
      font-size: 1.25rem;
      color: #ccc;
      margin-bottom: 10px;
    }

    .countdown {
      font-size: 3rem;
      color: #4ade80;
      font-weight: 600;
      margin-bottom: 40px;
    }

    .complete-message {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      color: #4ade80;
      gap: 10px;
      opacity: 0;
      animation: fadeIn 1s forwards;
    }

    .checkmark {
      width: 26px;
      height: 26px;
      stroke: #4ade80;
      stroke-width: 3;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    @keyframes fadeIn {
      to { opacity: 1; transform: translateY(0); }
      from { opacity: 0; transform: translateY(10px); }
    }
  </style>
</head>
<body>
  <div id="tsparticles"></div>

  <div class="content">
    <div class="loader-bar">
      <div id="progress" class="progress"></div>
    </div>
    <div id="message" class="message">Preparing your file...</div>
    <div id="countdown" class="countdown">3</div>
  </div>

  <script>
    // init particles
    tsParticles.load("tsparticles", {
      background: { color: "#0f0f0f" },
      fpsLimit: 60,
      particles: {
        number: { value: 60 },
        color: { value: "#4ade80" },
        shape: { type: "circle" },
        opacity: { value: 0.2 },
        size: { value: 2 },
        move: { enable: true, speed: 0.5 }
      },
      interactivity: {
        events: {
          onHover: { enable: true, mode: "repulse" }
        },
        modes: {
          repulse: { distance: 40 }
        }
      }
    });

    // main logic
    const messages = [
      "Preparing your file...",
      "Just a moment...",
      "Summoning download magic...",
      "Polishing bits & bytes...",
      "Hang tight, it's coming..."
    ];

    const fileName = new URLSearchParams(window.location.search).get('file');
    const messageEl = document.getElementById('message');
    const countdownEl = document.getElementById('countdown');
    const progressEl = document.getElementById('progress');

    if (!fileName) {
      messageEl.textContent = "Missing file parameter in URL.";
      countdownEl.style.display = 'none';
      progressEl.style.display = 'none';
    } else {
      messageEl.textContent = messages[Math.floor(Math.random() * messages.length)];
      let counter = 3;

      const interval = setInterval(() => {
        counter--;

        // update progress
        progressEl.style.width = `${((3 - counter) / 3) * 100}%`;

        if (counter > 0) {
          countdownEl.textContent = counter;
        } else if (counter === 0) {
          countdownEl.style.display = 'none';

          const completeMsg = document.createElement('div');
          completeMsg.classList.add('complete-message');
          completeMsg.innerHTML = `
            <svg class="checkmark" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
            Your download is complete, see you next time!
          `;
          document.querySelector('.content').appendChild(completeMsg);

          // vibrație pe mobil (doar dacă e permisă)
          if (navigator.vibrate) navigator.vibrate(100);
        } else if (counter === -1) {
          clearInterval(interval);
          const downloadUrl = `https://adelinjawwad.github.io/jawwad-demo/assets/downloads/${fileName}`;
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      }, 1000);
    }
  </script>
</body>
</html>
