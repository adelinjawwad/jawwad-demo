<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Download</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      background: #0f0f0f;
      color: white;
      font-family: 'Poppins', sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }

    .loader {
      width: 80px;
      height: 8px;
      background: #333;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
      margin-bottom: 24px;
    }

    .loader::before {
      content: '';
      position: absolute;
      top: 0;
      left: -40%;
      width: 40%;
      height: 100%;
      background: #4ade80;
      border-radius: 4px;
      animation: slide 1.5s infinite linear;
    }

    @keyframes slide {
      0% { left: -40%; }
      100% { left: 100%; }
    }

    .message {
      font-size: 1.25rem;
      color: #ccc;
      margin-bottom: 12px;
    }

    .countdown {
      font-size: 3rem;
      font-weight: 600;
      color: #4ade80;
      margin-bottom: 40px;
    }

    .complete-message {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 1.5rem;
      color: #4ade80;
    }

    .checkmark {
      width: 24px;
      height: 24px;
      stroke: #4ade80;
      stroke-width: 3;
      stroke-linecap: round;
      stroke-linejoin: round;
      fill: none;
    }
  </style>
</head>
<body>
  <div id="loader" class="loader"></div>
  <div id="message" class="message">Your download will start in</div>
  <div id="countdown" class="countdown">3</div>

  <script>
    const fileName = new URLSearchParams(window.location.search).get('file');
    const messageEl = document.getElementById('message');
    const countdownEl = document.getElementById('countdown');
    const loaderEl = document.getElementById('loader');

    if (!fileName) {
      loaderEl.style.display = 'none';
      messageEl.textContent = "Missing file parameter in URL.";
      countdownEl.style.display = 'none';
    } else {
      let counter = 3;
      const interval = setInterval(() => {
        counter--;

        if (counter > 0) {
          countdownEl.textContent = counter;
        } else if (counter === 0) {
          loaderEl.style.display = 'none';
          countdownEl.style.display = 'none';
          messageEl.style.display = 'none';

          const completeMsg = document.createElement('div');
          completeMsg.classList.add('complete-message');
          completeMsg.innerHTML = `
            <svg class="checkmark" viewBox="0 0 24 24">
              <polyline points="20 6 9 17 4 12" />
            </svg>
            Download complete. See you next time!
          `;
          document.body.appendChild(completeMsg);
        } else if (counter === -1) {
          clearInterval(interval);
          const downloadUrl = `https://adelinjawwad.github.io/jawwad-demo/assets/downloads/${fileName}`;
          const a = document.createElement('a');
          a.href = downloadUrl;
          a.download = fileName;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }
      }, 1000);
    }
  </script>
</body>
</html>
