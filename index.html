<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Jawwad ART</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="navbar">
    <div class="logo">Jawwad</div>
    <nav>
      <a href="#home" class="nav-link">Home</a>
      <div class="dropdown-parent">
        <a href="#costumes" class="nav-link">Costumes</a>
        <div class="dropdown">
          <a href="#costumes">Costumes</a>
          <a href="#hair">Hair</a>
          <a href="#weapons">Weapons</a>
          <a href="#npc">NPC</a>
          <a href="#others">Others</a>
        </div>
      </div>
      <a href="#free" class="nav-link">Free</a>
      <a href="#contact" class="nav-link">Contact</a>
    </nav>
  </div>

  <main id="content">
    <section id="home">
      <h1>Welcome to Jawwad ART</h1>
      <button id="discordToggle" class="download-btn">See Discord</button>
      <div id="discordWidget" class="discord-hidden">
        <!-- Replace with actual Discord Widget -->
        <iframe src="https://discord.com/widget?id=YOUR_SERVER_ID&theme=dark" width="350" height="400" allowtransparency="true" frameborder="0" sandbox="allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"></iframe>
      </div>
    </section>

    <section id="costumes" class="gallery-section">
      <h2>Gallery</h2>
      <img src="assets/img/sample.jpg" class="gallery-img" />
    </section>

    <section id="free">
      <h2>Free Downloads</h2>
      <div class="download-item">
        <p>Item 1</p>
        <a href="downloads/item1.zip" class="download-btn" download>Download</a>
        <p class="download-count">Downloaded 123 times</p>
      </div>
    </section>

    <section id="contact">
      <h2>Contact</h2>
      <p>Discord: Jawwad#1234</p>
    </section>
  </main>

  <script src="assets/js/app.js"></script>
</body>
</html>
