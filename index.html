	<body class=min-h-screen>
		<nav class="bg-black bg-opacity-30 backdrop-filter backdrop-blur-lg border-b border-gray-800 fixed w-full z-50">
			<div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
				<div class="flex items-center justify-between h-16">
					<div class="flex items-center">
						<div class=flex-shrink-0><span class="text-2xl font-bold bg-grwadient-to-r from-purple-400 to-pink-600 bg-clip-text text-transparent" aria-label="Jawwad ART Logo">Jawwad ART</span></div>
						<div class="hidden md:block">
							<div class="ml-10 flex items-baseline space-x-4">
								<a href="#" class="nav-link px-3 py-2 text-sm font-medium text-white hover:text-pink-300 transition" onclick="loadWelcome()"><i class="fa-solid fa-house"></i> Welcome</a>
								<div class=dropdown>
									<button class=dropbtn onclick=toggleDropdown()> Menu <i class="fa fa-chevron-down"></i></button>
									<div class=dropdown-content><a href=# class="nav-link px-3 py-2 text-sm font-medium text-white hover:text-pink-300 transition" onclick='loadContent("costumes")'>Costumes</a><a href=# class="nav-link px-3 py-2 text-sm font-medium text-white hover:text-pink-300 transition" onclick='loadContent("hairstyles")'>Hairstyles</a><a href=# class="nav-link px-3 py-2 text-sm font-medium text-white hover:text-pink-300 transition" onclick='loadContent("weapons")'>Weapons</a><a href=# class="nav-link px-3 py-2 text-sm font-medium text-white hover:text-pink-300 transition" onclick='loadContent("others")'>Others</a></div>
								</div>
								<a href=# class="nav-link px-3 py-2 text-sm font-medium text-white hover:text-pink-300 transition" onclick='loadContent("tutorials")'><i class="fas fa-chalkboard-teacher mr-2"></i> Tutorials </a><a href=# class="nav-link px-3 py-2 text-sm font-medium text-white hover:text-pink-300 transition" onclick='loadContent("tools")'><i class="fas fa-tools mr-2"></i> Tools </a><a href=# class="nav-link px-3 py-2 text-sm font-medium text-white hover:text-pink-300 transition" onclick='loadContent("free")'><i class="fas fa-gift mr-2"></i> Free Stuff</a><button onclick=copyDiscordTag() class="ml-4 px-4 py-2 bg-gradient-to-r from-purple-500 to-pink-600 text-white rounded-none hover:from-purple-600 hover:to-pink-700 transition flex items-center"><i class="fab fa-discord mr-2"></i> Contact </button>
							</div>
						</div>
					</div>
					<div class="-mr-2 flex md:hidden">
						<button type=button id=mobile-menu-button class="inline-flex items-center justify-center p-2 rounded-none text-gray-400 hover:text-white hover:bg-gray-700 focus:outline-none">
							<svg class="h-6 w-6" xmlns=http://www.w3.org/2000/svg fill=none viewBox="0 0 24 24" stroke=currentColor>
								<path stroke-linecap=round stroke-linejoin=round stroke-width=2 d="M4 6h16M4 12h16M4 18h16" />
							</svg>
						</button>
					</div>

					<!-- Linkuri pentru "Costumes", "Hairstyles", etc. -->
					<a href="#" class="block px-3 py-2 text-base font-medium text-white hover:bg-gray-800 rounded-none" onclick="loadContent('costumes')">Costumes</a>

					<a href="#" class="block px-3 py-2 text-base font-medium text-white hover:bg-gray-800 rounded-none" onclick="loadContent('others')">Others</a>
					<!-- Alte linkuri -->

			<div class="toast bg-green-600 text-white px-4 py-3 rounded-none shadow-lg flex items-center"><i class="fas fa-check-circle mr-2"></i><span id=toast-message>Copied to clipboard!</span></div>
		</div>
		<main class="pt-20 pb-10 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto">
			<div id="content-area"></div>
		</main>
		<div id=image-modal class="fixed inset-0 z-50 hidden modal-overlay flex items-center justify-center p-4">
			<div class="modal-content relative max-w-4xl w-full"><button onclick=closeModal() class="absolute -top-10 right-0 text-white hover:text-pink-300 text-2xl">
				<i class="fas fa-times"></i></button><img id=modal-image src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///ywAAAAAAQABAAACAUwAOw==" alt="Full size preview" loading="lazy" class="w-full max-h-[90vh] object-contain rounded-none">
			</div>
		</div>
		<script src="assets/js/app.min.js?v=1.1"></script>
