<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jawwad ART - Premium Metin2 Assets</title>
    <meta name="description" content="High-quality Metin2 assets, costumes, hairstyles, weapons, and tools by Jawwad ART. Professional 3D design and modeling services.">
    <meta name="keywords" content="Metin2, assets, costumes, hairstyles, weapons, 3D modeling, Jawwad ART">
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="assets/images/favicon.ico">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom CSS -->
    <link rel="stylesheet" href="assets/css/style.min.css">
</head>
<body>
    <!-- Compact Search System -->
    <div class="search-container">
        <div class="search-input-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="search-input" class="search-input" placeholder="Search assets...">
            <div id="search-results" class="search-results">
                <div class="search-placeholder">
                    <i class="fas fa-search"></i>
                    <p>Start typing to search assets...</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Search Overlay -->
    <div id="search-overlay" class="search-overlay"></div>

    <!-- Sexy Favorites Counter -->
    <div class="favorites-counter" onclick="showFavorites()" title="View your favorites">
        <i class="fas fa-heart"></i>
        <span id="favorites-count">0</span>
    </div>

    <!-- Favorites Modal -->
    <div id="favorites-modal" class="favorites-modal hidden">
        <div class="favorites-modal-content">
            <div id="favorites-list">
                <!-- Favorites content will be loaded here -->
            </div>
        </div>
    </div>

    <!-- Header - ORIGINAL DESIGN PRESERVED -->
    <header class="relative z-10 p-6">
        <nav class="flex items-center justify-between max-w-7xl mx-auto">
            <div class="logo-animated" onclick="renderWelcomeContent()">
                Jawwad ART
            </div>
            
            <div class="hidden md:flex items-center space-x-8">
                <a href="#" onclick="renderWelcomeContent()" class="nav-link text-white hover:text-pink-400 transition">Home</a>
                <a href="#" onclick="loadAllAssets()" class="nav-link text-white hover:text-pink-400 transition">Assets</a>
                
                <div class="dropdown">
                    <button onclick="toggleDropdown()" class="dropbtn">
                        More <i class="fas fa-chevron-down"></i>
                    </button>
                    <div class="dropdown-content">
                        <a href="#" onclick="loadContent('tools')">Tools</a>
                        <a href="#" onclick="loadContent('tutorials')">Tutorials</a>
                        <a href="#" onclick="loadContent('about')">About</a>
                    </div>
                </div>
                
                <button onclick="copyDiscordTag()" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition flex items-center">
                    <i class="fab fa-discord mr-2"></i>
                    Contact
                </button>
            </div>
            
            <button id="mobile-menu-button" class="md:hidden text-white">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </nav>
        
        <div id="mobile-menu" class="hidden md:hidden mt-4 bg-black bg-opacity-50 rounded-lg p-4">
            <a href="#" onclick="renderWelcomeContent()" class="block py-2 text-white hover:text-pink-400 transition">Home</a>
            <a href="#" onclick="loadAllAssets()" class="block py-2 text-white hover:text-pink-400 transition">Assets</a>
            <a href="#" onclick="loadContent('tools')" class="block py-2 text-white hover:text-pink-400 transition">Tools</a>
            <a href="#" onclick="loadContent('tutorials')" class="block py-2 text-white hover:text-pink-400 transition">Tutorials</a>
            <a href="#" onclick="loadContent('about')" class="block py-2 text-white hover:text-pink-400 transition">About</a>
            <button onclick="copyDiscordTag()" class="w-full mt-2 bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded-lg transition flex items-center justify-center">
                <i class="fab fa-discord mr-2"></i>
                Contact
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main class="relative z-10 min-h-screen px-6 pb-20">
        <div id="content-area" class="max-w-7xl mx-auto">
            <!-- Content will be loaded here -->
        </div>
    </main>

    <!-- Image Modal -->
    <div id="image-modal" class="hidden fixed inset-0 bg-black bg-opacity-90 z-50 flex items-center justify-center p-4">
        <div class="relative max-w-4xl max-h-full">
            <img id="modal-image" src="/placeholder.svg" alt="Preview" class="max-w-full max-h-full object-contain rounded-lg">
            <button onclick="closeModal()" class="absolute top-4 right-4 text-white bg-black bg-opacity-50 hover:bg-opacity-75 rounded-full p-2 transition">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast-container hidden">
        <div class="toast-box">
            <i class="fas fa-check-circle icon"></i>
            <span id="toast-message">Message</span>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer-glass mt-20 py-8 px-6">
        <div class="max-w-7xl mx-auto text-center">
            <div class="flex justify-center items-center space-x-6 mb-4">
                <a href="https://discord.gg/BBX8vfN4gQ" target="_blank" rel="noopener noreferrer" class="discord-icon" title="Join Discord">
                    <i class="fab fa-discord"></i>
                </a>
            </div>
            <p class="text-gray-400 text-sm">
                © 2024 Jawwad ART. All rights reserved. | Professional Metin2 Assets & Design Services
            </p>
        </div>
    </footer>

    <!-- JavaScript -->
    <script src="assets/js/app.min.js"></script>
</body>
</html>
