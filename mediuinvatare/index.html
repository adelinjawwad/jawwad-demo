<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <!-- IMPORTANT pentru iPhone 14 Pro Max + safe areas -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#070a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kirby Full Trainer — Dark Premium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark touch">
  <header class="top">
    <div class="brand">
      <div class="dot"></div>
      <h1>Kirby Full Trainer</h1>
    </div>
    <nav class="tabs" role="tablist" aria-label="Secțiuni">
      <!-- tabs generate din JS -->
    </nav>
  </header>

  <main>
    <section class="toolbar">
      <div class="select-wrap">
        <label class="lbl">Capitol:</label>
        <select id="chapterSelect" aria-label="Alege capitol"></select>
      </div>
      <div class="select-wrap">
        <label class="lbl">Subcapitol:</label>
        <select id="groupSelect" aria-label="Alege subcapitol"></select>
      </div>
      <button id="markAll" class="ghost wide">✓ Marchează tot subcapitolul ca învățat</button>
    </section>

    <section id="content" class="content">
      <!-- conținut randat din JS -->
    </section>

    <section class="legend">
      <span class="pill arg">ARGUMENT</span> = motiv/replică de vânzare pe care vrei s-o reții.
    </section>
  </main>

  <footer class="foot">
    <button id="prevBtn" class="ghost wide">◀️ Înapoi</button>
    <button id="nextBtn" class="primary wide">Următorul ▶️</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
