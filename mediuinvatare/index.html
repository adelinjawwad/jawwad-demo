<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="theme-color" content="#070a12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kirby Full Trainer — Dark Premium</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="dark touch">
  <header class="top">
    <div class="brand">
      <div class="dot"></div>
      <h1>Kirby Full Trainer</h1>
    </div>

    <!-- Tabs (desktop) -->
    <nav class="tabs" role="tablist" aria-label="Secțiuni"></nav>

    <!-- Buton meniu (mobil) -->
    <button id="openMenu" class="ghost menu-btn" aria-label="Deschide capitole">☰ Capitole</button>
    <button id="openQuiz" class="primary menu-btn" aria-label="Deschide test">🎯 Test</button>
  </header>

  <!-- Drawer mobil -->
  <aside id="drawer" class="drawer hidden" aria-hidden="true">
    <div class="drawer-backdrop"></div>
    <div class="drawer-sheet" role="dialog" aria-label="Capitole">
      <header class="drawer-head">
        <strong>Capitole</strong>
        <button id="closeMenu" class="ghost">✕</button>
      </header>
      <div id="drawerBody" class="drawer-body"></div>
      <footer class="drawer-foot">
        <button id="drawerCloseBottom" class="ghost wide">Închide</button>
      </footer>
    </div>
  </aside>

  <!-- Drawer Test (chestionare) -->
<aside id="quiz" class="drawer hidden" aria-hidden="true">
  <div class="drawer-backdrop"></div>
  <div class="drawer-sheet" role="dialog" aria-label="Test">
    <header class="drawer-head">
      <strong>Test rapid</strong>
      <button id="closeQuiz" class="ghost">✕</button>
    </header>

    <div id="quizConfig" class="drawer-body">
      <div class="cfg">
        <label>Tip test</label>
        <select id="quizMode">
          <option value="args">Argumente (full)</option>
          <option value="questions">Întrebări (full)</option>
          <option value="mix">Mix (toate)</option>
        </select>
      </div>
      <div class="cfg">
        <label>Număr întrebări</label>
        <select id="quizCount">
          <option>5</option><option selected>10</option><option>15</option><option>20</option>
        </select>
      </div>
      <button id="startQuiz" class="primary wide">Începe testul</button>
    </div>

    <div id="quizPlay" class="drawer-body hidden">
      <div class="q-head">
        <div id="qProgress">1/10</div>
        <div id="qTag" class="pill">—</div>
      </div>
      <div id="qPrompt" class="q-prompt"></div>

      <label class="q-label">Scrie replica (integral sau cât poți):</label>
      <textarea id="qInput" rows="6" placeholder="Scrie aici replica…"></textarea>

      <div class="q-actions">
        <button id="revealBtn" class="ghost">Afișează răspunsul</button>
        <button id="checkBtn" class="primary">Verifică</button>
      </div>

      <div id="qResult" class="q-result hidden"></div>

      <footer class="drawer-foot">
        <button id="nextQ" class="primary wide">Următoarea</button>
      </footer>
    </div>
  </div>
</aside>


  <main>
    <section class="toolbar">
      <div class="select-wrap">
        <label class="lbl">Capitol:</label>
        <select id="chapterSelect" aria-label="Alege capitol"></select>
      </div>
      <div class="select-wrap">
        <label class="lbl">Subcapitol:</label>
        <select id="groupSelect" aria-label="Alege subcapitol"></select>
      </div>
    </section>

    <section id="content" class="content"></section>

    <section class="legend">
      <span class="pill arg">ARGUMENT</span> = motiv/replică de vânzare pe care vrei s-o reții.
    </section>
  </main>

  <footer class="foot">
    <button id="prevBtn" class="ghost wide">◀️ Înapoi</button>
    <button id="nextBtn" class="primary wide">Următorul ▶️</button>
  </footer>

  <script src="app.js"></script>
</body>
</html>
