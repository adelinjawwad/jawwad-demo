<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | jawwad.site</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.4/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/particles.js@2.0.0/particles.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0a0a0a;
            color: #f5f5f5;
            overflow-x: hidden;
            position: relative;
        }
        
        #particles-js {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
        }
        
        .bg-x {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 40vw;
            font-weight: 900;
            color: rgba(30, 30, 30, 0.5);
            z-index: 1;
            user-select: none;
            opacity: 0.3;
        }
        
        .content {
            position: relative;
            z-index: 2;
        }
        
        .cta-button {
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .cta-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.4), transparent);
            transition: all 0.7s ease;
        }
        
        .cta-button:hover::before {
            left: 100%;
        }
        
        .discord-button {
            background-color: #5865F2;
        }
        
        .discord-button:hover {
            background-color: #4752C4;
        }
        
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .pulse {
            animation: pulse 4s infinite;
        }
        
        @keyframes neon {
            0% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #0073e6, 0 0 20px #0073e6; }
            50% { text-shadow: 0 0 10px #fff, 0 0 20px #fff, 0 0 30px #0073e6, 0 0 40px #0073e6; }
            100% { text-shadow: 0 0 5px #fff, 0 0 10px #fff, 0 0 15px #0073e6, 0 0 20px #0073e6; }
        }
        
        .neon-text {
            animation: neon 3s infinite;
        }
        
        @media (max-width: 768px) {
            .bg-x {
                font-size: 60vw;
            }
        }
        
        /* Glow effect for buttons */
        .glow {
            box-shadow: 0 0 15px rgba(99, 102, 241, 0.7);
        }
        
        .glow:hover {
            box-shadow: 0 0 25px rgba(99, 102, 241, 0.9);
        }
        
        .discord-glow {
            box-shadow: 0 0 15px rgba(88, 101, 242, 0.7);
        }
        
        .discord-glow:hover {
            box-shadow: 0 0 25px rgba(88, 101, 242, 0.9);
        }
        
        /* Matrix rain effect */
        .matrix-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.1;
            pointer-events: none;
        }
        
        /* Floating orbs */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.3;
            z-index: 1;
        }
        
        .orb-1 {
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(99, 102, 241, 0.8) 0%, rgba(99, 102, 241, 0) 70%);
            top: 20%;
            left: 10%;
            animation: floatOrb 15s ease-in-out infinite;
        }
        
        .orb-2 {
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(236, 72, 153, 0.8) 0%, rgba(236, 72, 153, 0) 70%);
            bottom: 15%;
            right: 10%;
            animation: floatOrb 18s ease-in-out infinite reverse;
        }
        
        @keyframes floatOrb {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(50px, -50px) rotate(10deg); }
            50% { transform: translate(100px, 0) rotate(0deg); }
            75% { transform: translate(50px, 50px) rotate(-10deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
    <div id="particles-js"></div>
    <div class="matrix-rain" id="matrixRain"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="bg-x select-none pulse">404</div>
    
    <div class="content max-w-4xl mx-auto text-center px-6 py-12">
        <div class="floating mb-8">
            <h1 class="text-8xl md:text-9xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-purple-400 via-pink-500 to-indigo-500 neon-text">
                404
            </h1>
            <h2 class="text-3xl md:text-4xl font-semibold mb-6 text-white">Page Not Found</h2>
            <p class="text-lg md:text-xl text-gray-300 max-w-lg mx-auto mb-10">
                Oops! The page you're looking for doesn't exist or has been moved.
            </p>
        </div>
        
        <div class="flex flex-col space-y-4 sm:flex-row sm:space-y-0 sm:space-x-4 justify-center">
            <a href="/" class="cta-button px-8 py-4 bg-gradient-to-r from-indigo-600 to-purple-600 text-white font-medium rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 glow flex items-center justify-center">
                <i class="fas fa-home mr-2"></i> Return to Homepage
            </a>
            <a href="https://discord.gg/YOUR_DISCORD_INVITE_LINK" target="_blank" class="cta-button px-8 py-4 discord-button text-white font-medium rounded-lg shadow-lg hover:shadow-xl transition-all duration-300 transform hover:scale-105 discord-glow flex items-center justify-center">
                <i class="fab fa-discord mr-2"></i> Join our Discord
            </a>
        </div>
        
        <div class="mt-16 text-gray-500 text-sm">
            <p>© 2023 jawwad.site • All rights reserved</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Initialize particles.js
            particlesJS('particles-js', {
                "particles": {
                    "number": {
                        "value": 80,
                        "density": {
                            "enable": true,
                            "value_area": 800
                        }
                    },
                    "color": {
                        "value": "#6366f1"
                    },
                    "shape": {
                        "type": "circle",
                        "stroke": {
                            "width": 0,
                            "color": "#000000"
                        },
                        "polygon": {
                            "nb_sides": 5
                        }
                    },
                    "opacity": {
                        "value": 0.5,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 1,
                            "opacity_min": 0.1,
                            "sync": false
                        }
                    },
                    "size": {
                        "value": 3,
                        "random": true,
                        "anim": {
                            "enable": true,
                            "speed": 2,
                            "size_min": 0.1,
                            "sync": false
                        }
                    },
                    "line_linked": {
                        "enable": true,
                        "distance": 150,
                        "color": "#6366f1",
                        "opacity": 0.4,
                        "width": 1
                    },
                    "move": {
                        "enable": true,
                        "speed": 1,
                        "direction": "none",
                        "random": true,
                        "straight": false,
                        "out_mode": "out",
                        "bounce": false,
                        "attract": {
                            "enable": true,
                            "rotateX": 600,
                            "rotateY": 1200
                        }
                    }
                },
                "interactivity": {
                    "detect_on": "canvas",
                    "events": {
                        "onhover": {
                            "enable": true,
                            "mode": "grab"
                        },
                        "onclick": {
                            "enable": true,
                            "mode": "push"
                        },
                        "resize": true
                    },
                    "modes": {
                        "grab": {
                            "distance": 140,
                            "line_linked": {
                                "opacity": 1
                            }
                        },
                        "bubble": {
                            "distance": 400,
                            "size": 40,
                            "duration": 2,
                            "opacity": 8,
                            "speed": 3
                        },
                        "repulse": {
                            "distance": 200,
                            "duration": 0.4
                        },
                        "push": {
                            "particles_nb": 4
                        },
                        "remove": {
                            "particles_nb": 2
                        }
                    }
                },
                "retina_detect": true
            });

            // Simple matrix rain effect
            const matrixRain = document.getElementById('matrixRain');
            const chars = "01";
            const fontSize = 14;
            const columns = Math.floor(window.innerWidth / fontSize);
            
            let drops = [];
            for (let i = 0; i < columns; i++) {
                drops[i] = Math.floor(Math.random() * -100);
            }
            
            function drawMatrix() {
                let output = '';
                for (let i = 0; i < drops.length; i++) {
                    const text = chars.charAt(Math.floor(Math.random() * chars.length));
                    const opacity = Math.random();
                    output += `<span style="color: rgba(0, 255, 0, ${opacity}); position: absolute; top: ${drops[i] * fontSize}px; left: ${i * fontSize}px;">${text}</span>`;
                    
                    if (drops[i] * fontSize > window.innerHeight && Math.random() > 0.975) {
                        drops[i] = 0;
                    }
                    drops[i]++;
                }
                matrixRain.innerHTML = output;
            }
            
            setInterval(drawMatrix, 50);

            // GSAP animations
            gsap.from(".bg-x", {
                duration: 2,
                opacity: 0,
                scale: 0.5,
                ease: "elastic.out(1, 0.5)"
            });
            
            gsap.from("h1", {
                duration: 1,
                y: -50,
                opacity: 0,
                delay: 0.5,
                ease: "back.out(1.7)",
                onComplete: function() {
                    gsap.to("h1", {
                        duration: 2,
                        scale: 1.05,
                        repeat: -1,
                        yoyo: true,
                        ease: "sine.inOut"
                    });
                }
            });
            
            gsap.from("h2", {
                duration: 0.8,
                y: -30,
                opacity: 0,
                delay: 0.8,
                ease: "back.out(1.7)"
            });
            
            gsap.from("p", {
                duration: 0.8,
                y: -20,
                opacity: 0,
                delay: 1.1,
                ease: "back.out(1.7)"
            });
            
            gsap.from(".cta-button", {
                duration: 1,
                y: 30,
                opacity: 0,
                delay: 1.4,
                ease: "back.out(1.7)",
                stagger: 0.2
            });
            
            // Add pulse effect to buttons on hover
            document.querySelectorAll('.cta-button').forEach(button => {
                button.addEventListener('mouseenter', () => {
                    gsap.to(button, {
                        duration: 0.3,
                        scale: 1.1,
                        y: -5,
                        ease: "power1.out"
                    });
                });
                
                button.addEventListener('mouseleave', () => {
                    gsap.to(button, {
                        duration: 0.3,
                        scale: 1,
                        y: 0,
                        ease: "power1.out"
                    });
                });
            });
            
            // Floating orbs animation
            gsap.to(".orb-1", {
                duration: 20,
                x: "+=100",
                y: "+=50",
                rotation: 10,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut"
            });
            
            gsap.to(".orb-2", {
                duration: 25,
                x: "-=120",
                y: "+=80",
                rotation: -15,
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut"
            });
            
            // Background pulse effect
            gsap.to("body", {
                duration: 10,
                backgroundPosition: "0 50px",
                repeat: -1,
                yoyo: true,
                ease: "sine.inOut"
            });
        });
    </script>
</body>
</html>
