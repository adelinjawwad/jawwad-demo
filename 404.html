<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>404 | Terminal Breach</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: black;
      color: #00ff66;
      font-family: 'Courier New', monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    .glow {
      text-shadow: 0 0 5px #00ff66, 0 0 10px #00ff66, 0 0 20px #00ff66;
    }

    h1 {
      font-size: 6rem;
      margin-bottom: 1rem;
      animation: glitch 1.2s infinite;
    }

    p {
      font-size: 1.4rem;
      margin-bottom: 2rem;
      white-space: pre;
      animation: type 4s steps(40) 1;
      overflow: hidden;
      border-right: 2px solid #00ff66;
    }

    @keyframes glitch {
      0% { transform: translate(0); }
      20% { transform: translate(-1px, 1px); }
      40% { transform: translate(1px, -1px); }
      60% { transform: translate(-2px, 2px); }
      80% { transform: translate(2px, -2px); }
      100% { transform: translate(0); }
    }

    @keyframes type {
      from { width: 0 }
      to { width: 100% }
    }

    a {
      padding: 10px 25px;
      background: none;
      border: 2px solid #00ff66;
      color: #00ff66;
      text-decoration: none;
      font-weight: bold;
      transition: all 0.3s ease;
      cursor: pointer;
      box-shadow: 0 0 20px #00ff66;
    }

    a:hover {
      background: #00ff66;
      color: #000;
      box-shadow: 0 0 40px #00ff66;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      z-index: -1;
    }
  </style>
</head>
<body>
  <canvas id="matrix"></canvas>

  <h1 class="glow">404</h1>
  <p id="terminal">[SYSTEM ERROR] The page you're looking for does not exist. Redirect protocol engaged...</p>
  <a href="/">Return to Mainframe</a>

  <script>
    // Matrix background effect
    const canvas = document.getElementById("matrix");
    const ctx = canvas.getContext("2d");

    canvas.height = window.innerHeight;
    canvas.width = window.innerWidth;

    let chars = "010101010101";
    chars = chars.split("");

    const font_size = 14;
    const columns = canvas.width / font_size;
    const drops = Array.from({ length: columns }).fill(1);

    function drawMatrix() {
      ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ff66";
      ctx.font = font_size + "px monospace";

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * font_size, drops[i] * font_size);

        if (drops[i] * font_size > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }

        drops[i]++;
      }
    }

    setInterval(drawMatrix, 33);
  </script>
</body>
</html>
