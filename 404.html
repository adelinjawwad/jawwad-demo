<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f0f23 0%, #1a1a2e 50%, #16213e 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
            color: #e5e7eb;
        }

        /* Enhanced animated background */
        .bg-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.15) 0%, transparent 50%),
                        radial-gradient(circle at 80% 20%, rgba(255, 119, 198, 0.12) 0%, transparent 50%),
                        radial-gradient(circle at 40% 40%, rgba(120, 219, 226, 0.08) 0%, transparent 50%);
            animation: bgShift 25s ease-in-out infinite;
        }

        @keyframes bgShift {
            0%, 100% { opacity: 0.6; transform: scale(1) rotate(0deg); }
            50% { opacity: 0.9; transform: scale(1.05) rotate(0.5deg); }
        }

        /* Floating text elements */
        .floating-text {
            position: absolute;
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.05);
            font-size: 14px;
            animation: textFloat 20s infinite ease-in-out;
            pointer-events: none;
            user-select: none;
        }

        .text-1 {
            top: 15%;
            left: 8%;
            animation-delay: 0s;
        }

        .text-2 {
            top: 25%;
            right: 12%;
            animation-delay: 7s;
        }

        .text-3 {
            bottom: 30%;
            left: 15%;
            animation-delay: 14s;
        }

        @keyframes textFloat {
            0%, 100% { 
                opacity: 0.03;
                transform: translateY(0px) rotate(0deg);
            }
            50% { 
                opacity: 0.08;
                transform: translateY(-15px) rotate(1deg);
            }
        }

        /* Subtle floating particles */
        .particles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .particle {
            position: absolute;
            width: 2px;
            height: 2px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            animation: subtleFloat 12s ease-in-out infinite;
        }

        @keyframes subtleFloat {
            0%, 100% { 
                transform: translateY(0px) translateX(0px); 
                opacity: 0.2; 
            }
            50% { 
                transform: translateY(-15px) translateX(10px); 
                opacity: 0.4; 
            }
        }

        /* Main container */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
            position: relative;
            z-index: 10;
            padding: 20px;
        }

        /* Enhanced 404 number with better typography */
        .error-code {
            font-family: 'Inter', sans-serif;
            font-size: clamp(100px, 18vw, 280px);
            font-weight: 900;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 30px;
            position: relative;
            filter: drop-shadow(0 0 30px rgba(99, 102, 241, 0.3));
            animation: subtleGlow 4s ease-in-out infinite;
            letter-spacing: -0.05em;
        }

        /* Enhanced glitch effect */
        .error-code::before {
            content: '404';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #ef4444 0%, #f59e0b 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: subtleGlitch 8s infinite;
            opacity: 0;
        }

        /* Typography improvements */
        .title {
            font-family: 'Inter', sans-serif;
            font-size: clamp(28px, 5vw, 42px);
            color: #f8fafc;
            margin-bottom: 16px;
            font-weight: 600;
            letter-spacing: -0.02em;
            animation: fadeIn 1.2s ease-out 0.3s both;
        }

        .description {
            font-family: 'Inter', sans-serif;
            font-size: clamp(16px, 3vw, 18px);
            color: #94a3b8;
            margin-bottom: 40px;
            max-width: 500px;
            line-height: 1.7;
            font-weight: 400;
            animation: fadeIn 1.2s ease-out 0.5s both;
            letter-spacing: 0.01em;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Enhanced buttons with better typography */
        .btn-container {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
            animation: fadeIn 1.2s ease-out 0.7s both;
        }

        .btn {
            font-family: 'Inter', sans-serif;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: 500;
            text-decoration: none;
            border-radius: 12px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            backdrop-filter: blur(10px);
            letter-spacing: 0.005em;
        }

        .btn-primary {
            background: rgba(99, 102, 241, 0.1);
            color: #e2e8f0;
            border: 1px solid rgba(99, 102, 241, 0.2);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.05);
            color: #cbd5e1;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transition: left 0.6s ease;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
        }

        .btn-primary:hover {
            background: rgba(99, 102, 241, 0.15);
            border-color: rgba(99, 102, 241, 0.3);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(255, 255, 255, 0.15);
        }

        /* Subtle pulse animation for the main number */
        .error-code {
            animation: subtleGlow 4s ease-in-out infinite, breathe 6s ease-in-out infinite;
        }

        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        /* Enhanced floating elements with better positioning */
        .floating-element {
            position: absolute;
            opacity: 0.04;
            animation: gentleFloat 15s infinite ease-in-out;
            border-radius: 50%;
            backdrop-filter: blur(1px);
        }

        .element-1 {
            top: 15%;
            left: 10%;
            width: 120px;
            height: 120px;
            background: linear-gradient(45deg, #6366f1, #8b5cf6);
            animation-delay: 0s;
        }

        .element-2 {
            top: 60%;
            right: 15%;
            width: 80px;
            height: 80px;
            background: linear-gradient(45deg, #8b5cf6, #06b6d4);
            animation-delay: 5s;
        }

        .element-3 {
            bottom: 20%;
            left: 20%;
            width: 100px;
            height: 100px;
            background: linear-gradient(45deg, #06b6d4, #10b981);
            animation-delay: 10s;
        }

        /* Enhanced grid pattern */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.7;
        }

        /* Responsive design */
        @media (max-width: 768px) {
            .btn-container {
                flex-direction: column;
                align-items: center;
                gap: 12px;
            }
            
            .btn {
                width: 180px;
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <!-- Background elements -->
    <div class="bg-overlay"></div>
    <div class="grid-bg"></div>
    
    <!-- Floating text elements -->
    <div class="floating-text text-1">lost connection...</div>
    <div class="floating-text text-2">page.not.found</div>
    <div class="floating-text text-3">return home...</div>
    
    <!-- Subtle floating particles -->
    <div class="particles" id="particles"></div>
    
    <!-- Floating elements -->
    <div class="floating-element element-1"></div>
    <div class="floating-element element-2"></div>
    <div class="floating-element element-3"></div>
    
    <!-- Main content -->
    <div class="container">
        <h1 class="error-code">404</h1>
        <h2 class="title">Page Not Found</h2>
        <p class="description">
            The page you're looking for doesn't exist.
        </p>
        <div class="btn-container">
            <a href="/" class="btn btn-primary" id="homeBtn">
                <span>←</span> Homepage
            </a>
        </div>
    </div>

    <script>
        // Create subtle floating particles
        function createParticles() {
            const particlesContainer = document.getElementById('particles');
            const particleCount = 30;

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.className = 'particle';
                
                // Random position
                particle.style.left = Math.random() * 100 + '%';
                particle.style.top = Math.random() * 100 + '%';
                
                // Random animation delay and duration
                particle.style.animationDelay = Math.random() * 12 + 's';
                particle.style.animationDuration = (Math.random() * 8 + 10) + 's';
                
                particlesContainer.appendChild(particle);
            }
        }

        // Go back function
        function goBack() {
            if (window.history.length > 1) {
                window.history.back();
            } else {
                window.location.href = '/';
            }
        }

        // Subtle mouse parallax effect
        document.addEventListener('mousemove', (e) => {
            const elements = document.querySelectorAll('.floating-element');
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            
            elements.forEach((element, index) => {
                const speed = (index + 1) * 0.01;
                const xOffset = (x - 0.5) * 20 * speed;
                const yOffset = (y - 0.5) * 20 * speed;
                
                element.style.transform = `translate(${xOffset}px, ${yOffset}px)`;
            });
        });

        // Subtle button interaction
        document.querySelectorAll('.btn').forEach(btn => {
            btn.addEventListener('mouseenter', function() {
                this.style.transform = 'translateY(-1px) scale(1.02)';
            });
            
            btn.addEventListener('mouseleave', function() {
                this.style.transform = 'translateY(0) scale(1)';
            });
        });

        // Initialize particles when page loads
        window.addEventListener('load', createParticles);

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                goBack();
            }
        });
    </script>
</body>
</html>
