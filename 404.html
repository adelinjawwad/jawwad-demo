<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @keyframes float {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-20px);
            }
        }
        .floating {
            animation: float 6s ease-in-out infinite;
        }
        .glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .gradient-text {
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center overflow-hidden relative">
    <!-- Particles background -->
    <div id="particles-container" class="absolute inset-0 overflow-hidden"></div>
    
    <div class="container mx-auto px-4 z-10">
        <div class="max-w-4xl mx-auto text-center">
            <!-- Animated 404 text -->
            <div class="floating mb-8">
                <h1 class="text-9xl font-bold gradient-text">404</h1>
            </div>
            
            <h2 class="text-4xl font-bold mb-4">Oops! Page Not Found</h2>
            <p class="text-xl text-gray-400 mb-8 max-w-lg mx-auto">
                The page you're looking for doesn't exist or has been moved. 
                Let's get you back on track.
            </p>
            
            <!-- Return home button with icon -->
            <a href="/" class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full text-white font-semibold text-lg hover:from-blue-600 hover:to-purple-700 transition-all duration-300 transform hover:scale-105 glow">
                <i class="fas fa-home mr-3"></i>
                Return Home
            </a>
            
            <!-- Additional decorative elements -->
            <div class="mt-16 flex justify-center space-x-8">
                <div class="w-16 h-16 rounded-full bg-blue-500 opacity-20"></div>
                <div class="w-16 h-16 rounded-full bg-purple-500 opacity-20"></div>
                <div class="w-16 h-16 rounded-full bg-pink-500 opacity-20"></div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="absolute bottom-0 w-full py-6 text-center text-gray-500 text-sm z-10">
        <p>© 2023 Premium Dark Theme. All rights reserved.</p>
    </footer>

    <script>
        // Create floating particles
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('particles-container');
            const particleCount = 30;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties
                const size = Math.random() * 5 + 1;
                const posX = Math.random() * window.innerWidth;
                const posY = Math.random() * window.innerHeight;
                const opacity = Math.random() * 0.5 + 0.1;
                const animationDuration = Math.random() * 10 + 5;
                const delay = Math.random() * 5;
                
                // Apply styles
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}px`;
                particle.style.top = `${posY}px`;
                particle.style.opacity = opacity;
                particle.style.animation = `float ${animationDuration}s ease-in-out ${delay}s infinite`;
                
                container.appendChild(particle);
            }
            
            // Make particles follow mouse (subtle effect)
            document.addEventListener('mousemove', function(e) {
                const particles = document.querySelectorAll('.particle');
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                
                particles.forEach(particle => {
                    const particleX = parseFloat(particle.style.left) + (particle.offsetWidth / 2);
                    const particleY = parseFloat(particle.style.top) + (particle.offsetHeight / 2);
                    
                    const distX = mouseX - particleX;
                    const distY = mouseY - particleY;
                    
                    // Only move particles slightly towards mouse
                    particle.style.transform = `translate(${distX * 0.01}px, ${distY * 0.01}px)`;
                });
            });
        });
    </script>
</body>
</html>
