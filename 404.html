<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The page doesn't exist</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    		<!-- Favicon -->
		<link rel="icon" type="image/png" href="assets/ico/favicon-96x96.png" sizes="96x96">
		<link rel="icon" type="image/svg+xml" href="assets/ico/favicon.svg">
		<link rel="shortcut icon" href="assets/ico/favicon.ico">
		<link rel="apple-touch-icon" sizes="180x180" href="assets/ico/apple-touch-icon.png">
    <style>
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 0.9; }
        }
        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .floating { animation: float 6s ease-in-out infinite; }
        .pulse { animation: pulse 4s ease-in-out infinite; }
        .rotate { animation: rotate 20s linear infinite; }
        .gradient-text {
            background: linear-gradient(45deg, #3b82f6, #8b5cf6, #ec4899);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .glow {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.5);
        }
        .bg-grid {
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .particle {
            position: absolute;
            background: rgba(255, 255, 255, 0.5);
            border-radius: 50%;
            pointer-events: none;
        }
        .btn-hover-effect {
            position: relative;
            overflow: hidden;
        }
        .btn-hover-effect::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: 0.5s;
        }
        .btn-hover-effect:hover::after {
            left: 100%;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen flex flex-col items-center justify-center overflow-hidden relative bg-grid">
    <!-- Animated background elements -->
    <div class="absolute inset-0 overflow-hidden">
        <div class="absolute top-1/4 left-1/4 w-32 h-32 rounded-full bg-blue-500 opacity-10 pulse rotate"></div>
        <div class="absolute top-1/3 right-1/4 w-40 h-40 rounded-full bg-purple-500 opacity-10 pulse -rotate" style="animation-delay: 2s;"></div>
        <div class="absolute bottom-1/4 left-1/3 w-24 h-24 rounded-full bg-pink-500 opacity-10 pulse rotate" style="animation-delay: 4s;"></div>
    </div>
    
    <!-- Particles container -->
    <div id="particles-container" class="absolute inset-0 overflow-hidden"></div>
    
    <div class="container mx-auto px-4 z-10">
        <div class="max-w-4xl mx-auto text-center">
            <!-- Animated 404 text with floating effect -->
            <div class="floating mb-8">
                <h1 class="text-9xl font-bold gradient-text">404</h1>
            </div>
            
            <h2 class="text-4xl font-bold mb-4">Lost in the Digital Void</h2>
            <p class="text-xl text-gray-400 mb-8 max-w-lg mx-auto">
                The page you're seeking has vanished into the ether. 
                Perhaps it never existed, or maybe it's just hiding. 
                Let's find our way back to familiar territory.
            </p>
            
            <!-- Return home button with hover effect -->
            <a href="/" class="inline-flex items-center px-8 py-4 bg-gradient-to-r from-blue-500 to-purple-600 rounded-full text-white font-semibold text-lg hover:from-blue-600 hover:to-purple-700 transition-all duration-300 transform hover:scale-105 glow btn-hover-effect">
                <i class="fas fa-home mr-3"></i>
                Return to Safety
            </a>
            
            <!-- Decorative tech elements -->
            <div class="mt-16 flex justify-center space-x-8">
                <div class="w-4 h-4 rounded-full bg-blue-400 animate-pulse"></div>
                <div class="w-4 h-4 rounded-full bg-purple-400 animate-pulse" style="animation-delay: 0.3s;"></div>
                <div class="w-4 h-4 rounded-full bg-pink-400 animate-pulse" style="animation-delay: 0.6s;"></div>
            </div>
        </div>
    </div>
    
    <!-- Footer with subtle animation -->
    <footer class="absolute bottom-0 w-full py-6 text-center text-gray-500 text-sm z-10 transform transition duration-500 hover:text-gray-300">
        <p>© <span id="year"></span> Jawwad ART</p>
    </footer>

    <script>
        // Set current year in footer
        document.getElementById('year').textContent = new Date().getFullYear();
        
        // Create floating particles
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('particles-container');
            const particleCount = 50;
            
            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                
                // Random properties
                const size = Math.random() * 4 + 1;
                const posX = Math.random() * window.innerWidth;
                const posY = Math.random() * window.innerHeight;
                const opacity = Math.random() * 0.3 + 0.1;
                const animationDuration = Math.random() * 10 + 5;
                const delay = Math.random() * 5;
                
                // Apply styles
                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.left = `${posX}px`;
                particle.style.top = `${posY}px`;
                particle.style.opacity = opacity;
                particle.style.animation = `float ${animationDuration}s ease-in-out ${delay}s infinite`;
                
                container.appendChild(particle);
            }
            
            // Mouse parallax effect
            document.addEventListener('mousemove', function(e) {
                const particles = document.querySelectorAll('.particle');
                const mouseX = e.clientX;
                const mouseY = e.clientY;
                
                particles.forEach(particle => {
                    const particleX = parseFloat(particle.style.left) + (particle.offsetWidth / 2);
                    const particleY = parseFloat(particle.style.top) + (particle.offsetHeight / 2);
                    
                    const distX = mouseX - particleX;
                    const distY = mouseY - particleY;
                    
                    particle.style.transform = `translate(${distX * 0.01}px, ${distY * 0.01}px)`;
                });
            });
            
            // Button ripple effect
            const button = document.querySelector('.btn-hover-effect');
            button.addEventListener('click', function(e) {
                e.preventDefault();
                
                // Create ripple
                const ripple = document.createElement('span');
                ripple.classList.add('absolute', 'bg-white', 'rounded-full', 'transform', 'scale-0', 'animate-ripple');
                ripple.style.left = `${e.offsetX}px`;
                ripple.style.top = `${e.offsetY}px`;
                this.appendChild(ripple);
                
                // Remove ripple after animation
                setTimeout(() => {
                    ripple.remove();
                    window.location.href = '/';
                }, 1000);
            });
        });
    </script>
</body>
</html>
