<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventar Bar - Gestionare Săptămânală</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --background: 0 0% 3.9%;
            --foreground: 0 0% 98%;
            --card: 0 0% 3.9%;
            --card-foreground: 0 0% 98%;
            --popover: 0 0% 3.9%;
            --popover-foreground: 0 0% 98%;
            --primary: 0 0% 98%;
            --primary-foreground: 0 0% 9%;
            --secondary: 0 0% 14.9%;
            --secondary-foreground: 0 0% 98%;
            --muted: 0 0% 14.9%;
            --muted-foreground: 0 0% 63.9%;
            --accent: 0 0% 14.9%;
            --accent-foreground: 0 0% 98%;
            --destructive: 0 62.8% 30.6%;
            --destructive-foreground: 0 0% 98%;
            --border: 0 0% 14.9%;
            --input: 0 0% 14.9%;
            --ring: 0 0% 83.1%;
            --radius: 0.5rem;
        }
        
        * {
            border-color: hsl(var(--border));
        }
        
        body {
            background-color: hsl(var(--background));
            color: hsl(var(--foreground));
            font-family: 'Inter', sans-serif;
        }
        
        .card {
            background-color: hsl(var(--card));
            color: hsl(var(--card-foreground));
            border: 1px solid hsl(var(--border));
        }
        
        .btn-primary {
            background-color: hsl(var(--primary));
            color: hsl(var(--primary-foreground));
        }
        
        .btn-secondary {
            background-color: hsl(var(--secondary));
            color: hsl(var(--secondary-foreground));
        }
        
        .text-muted {
            color: hsl(var(--muted-foreground));
        }
        
        .bg-destructive {
            background-color: hsl(var(--destructive));
        }
        
        .sticky-header {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(8px);
            background-color: rgba(3, 7, 18, 0.8);
        }
        
        .product-row {
            transition: all 0.2s ease;
        }
        
        .product-row:hover {
            background-color: hsl(var(--accent));
        }
        
        .low-stock {
            background-color: rgba(239, 68, 68, 0.1);
            border-left: 4px solid #ef4444;
        }
        
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 100;
        }
        
        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .modal-content {
            background-color: hsl(var(--card));
            border-radius: var(--radius);
            max-width: 90vw;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .product-table {
                font-size: 0.875rem;
            }
            
            .product-table th,
            .product-table td {
                padding: 0.5rem 0.25rem;
            }
        }
    </style>
</head>
<body class="min-h-screen">
    <div id="app">
        <!-- Header Sticky -->
        <div class="sticky-header border-b p-4">
            <div class="flex items-center justify-between">
                <div>
                    <h1 class="text-xl font-bold">Inventar Bar</h1>
                    <p class="text-sm text-muted" id="current-week"></p>
                </div>
                <div class="flex gap-2">
                    <button onclick="exportToPDF()" class="btn-secondary px-3 py-2 rounded-lg text-sm font-medium">
                        📄 Export PDF
                    </button>
                    <button onclick="showHistory()" class="btn-secondary px-3 py-2 rounded-lg text-sm font-medium">
                        📊 Istoric
                    </button>
                    <button onclick="newWeek()" class="btn-primary px-3 py-2 rounded-lg text-sm font-medium">
                        🔄 Săptămână Nouă
                    </button>
                </div>
            </div>
        </div>

        <!-- Statistici -->
        <div class="p-4">
            <div class="stats-grid grid grid-cols-4 gap-4 mb-6">
                <div class="card rounded-lg p-4">
                    <div class="text-2xl font-bold" id="total-revenue">0 lei</div>
                    <div class="text-sm text-muted">Venituri Săptămână</div>
                </div>
                <div class="card rounded-lg p-4">
                    <div class="text-2xl font-bold" id="total-profit">0 lei</div>
                    <div class="text-sm text-muted">Profit Săptămână</div>
                </div>
                <div class="card rounded-lg p-4">
                    <div class="text-2xl font-bold" id="total-sold">0</div>
                    <div class="text-sm text-muted">Produse Vândute</div>
                </div>
                <div class="card rounded-lg p-4">
                    <div class="text-2xl font-bold text-red-400" id="low-stock-count">0</div>
                    <div class="text-sm text-muted">Stoc Scăzut</div>
                </div>
            </div>

            <!-- Tabel Produse -->
            <div class="card rounded-lg overflow-hidden">
                <div class="overflow-x-auto">
                    <table class="product-table w-full">
                        <thead class="bg-secondary">
                            <tr>
                                <th class="text-left p-3 font-medium">Produs</th>
                                <th class="text-left p-3 font-medium">Stoc Inițial</th>
                                <th class="text-left p-3 font-medium">Preț (lei)</th>
                                <th class="text-left p-3 font-medium">Vândute</th>
                                <th class="text-left p-3 font-medium">Stoc Final</th>
                                <th class="text-left p-3 font-medium">Venituri</th>
                            </tr>
                        </thead>
                        <tbody id="products-table">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Istoric -->
    <div id="history-modal" class="modal">
        <div class="modal-content p-6 m-4">
            <div class="flex items-center justify-between mb-4">
                <h2 class="text-xl font-bold">Istoric Modificări</h2>
                <button onclick="closeHistory()" class="text-muted hover:text-foreground">✕</button>
            </div>
            <div id="history-content" class="space-y-2 max-h-96 overflow-y-auto">
            </div>
        </div>
    </div>

    <script>
        // Date și utilități
        function getCurrentWeek() {
            const now = new Date();
            const sunday = new Date(now);
            sunday.setDate(now.getDate() - now.getDay());
            const nextSunday = new Date(sunday);
            nextSunday.setDate(sunday.getDate() + 6);
            
            return {
                start: sunday,
                end: nextSunday,
                text: `${sunday.toLocaleDateString('ro-RO')} - ${nextSunday.toLocaleDateString('ro-RO')}`
            };
        }

        // Date inițiale produse
        const initialProducts = [
            { name: "Fanta struguri", initialStock: 21, price: 9 },
            { name: "Cola zero", initialStock: 46, price: 9 },
            { name: "Schw. bitter", initialStock: 33, price: 9 },
            { name: "Schw. kinly", initialStock: 33, price: 9 },
            { name: "Schw. mand.", initialStock: 19, price: 9 },
            { name: "Schw. pink", initialStock: 5, price: 9 },
            { name: "Fanta", initialStock: 4, price: 9 },
            { name: "Sprite", initialStock: 3, price: 9 },
            { name: "Cola", initialStock: 56, price: 9 },
            { name: "Apă minerală", initialStock: 24, price: 9 },
            { name: "Apă plată", initialStock: 24, price: 9 },
            { name: "Ursus nefiltrat", initialStock: 6, price: 9 },
            { name: "Kozel dark", initialStock: 6, price: 10 },
            { name: "Kozel premium", initialStock: 6, price: 10 },
            { name: "Ursus premium", initialStock: 17, price: 9 },
            { name: "Ursus FA", initialStock: 9, price: 9 },
            { name: "Peroni Capri", initialStock: 4, price: 9 },
            { name: "Ursus Cooler", initialStock: 3, price: 9 },
            { name: "Corona", initialStock: 17, price: 9 },
            { name: "Santal", initialStock: 2, price: 9 },
            { name: "Redbull", initialStock: 9, price: 11 },
            { name: "Figa", initialStock: 9, price: 11 }
        ];

        // State management
        let products = [];
        let history = [];

        // Încărcare date
        function loadData() {
            const savedProducts = localStorage.getItem('barInventoryProducts');
            const savedHistory = localStorage.getItem('barInventoryHistory');
            
            if (savedProducts) {
                products = JSON.parse(savedProducts);
            } else {
                products = initialProducts.map(p => ({
                    ...p,
                    sold: 0,
                    id: Math.random().toString(36).substr(2, 9)
                }));
            }
            
            if (savedHistory) {
                history = JSON.parse(savedHistory);
            }
        }

        // Salvare date
        function saveData() {
            localStorage.setItem('barInventoryProducts', JSON.stringify(products));
            localStorage.setItem('barInventoryHistory', JSON.stringify(history));
        }

        // Adăugare în istoric
        function addToHistory(action, product, oldValue, newValue) {
            history.unshift({
                timestamp: new Date().toLocaleString('ro-RO'),
                action,
                product,
                oldValue,
                newValue
            });
            
            // Păstrează doar ultimele 100 de intrări
            if (history.length > 100) {
                history = history.slice(0, 100);
            }
            
            saveData();
        }

        // Actualizare statistici
        function updateStats() {
            const totalRevenue = products.reduce((sum, p) => sum + (p.sold * p.price), 0);
            const totalSold = products.reduce((sum, p) => sum + p.sold, 0);
            const lowStockCount = products.filter(p => (p.initialStock - p.sold) <= 5).length;
            
            document.getElementById('total-revenue').textContent = `${totalRevenue} lei`;
            document.getElementById('total-profit').textContent = `${Math.round(totalRevenue * 0.6)} lei`;
            document.getElementById('total-sold').textContent = totalSold;
            document.getElementById('low-stock-count').textContent = lowStockCount;
        }

        // Randare tabel
        function renderTable() {
            const tbody = document.getElementById('products-table');
            tbody.innerHTML = '';
            
            products.forEach((product, index) => {
                const finalStock = product.initialStock - product.sold;
                const revenue = product.sold * product.price;
                const isLowStock = finalStock <= 5;
                
                const row = document.createElement('tr');
                row.className = `product-row border-b ${isLowStock ? 'low-stock' : ''}`;
                
                row.innerHTML = `
                    <td class="p-3 font-medium">${product.name}</td>
                    <td class="p-3">${product.initialStock}</td>
                    <td class="p-3">${product.price} lei</td>
                    <td class="p-3">
                        <div class="flex items-center gap-2">
                            <button onclick="updateSold(${index}, -1)" class="w-8 h-8 rounded bg-secondary hover:bg-accent flex items-center justify-center">-</button>
                            <span class="w-8 text-center">${product.sold}</span>
                            <button onclick="updateSold(${index}, 1)" class="w-8 h-8 rounded bg-secondary hover:bg-accent flex items-center justify-center">+</button>
                        </div>
                    </td>
                    <td class="p-3 ${isLowStock ? 'text-red-400 font-bold' : ''}">${finalStock}</td>
                    <td class="p-3 font-medium">${revenue} lei</td>
                `;
                
                tbody.appendChild(row);
            });
        }

        // Actualizare vânzări
        function updateSold(index, change) {
            const product = products[index];
            const oldValue = product.sold;
            const newValue = Math.max(0, Math.min(product.initialStock, oldValue + change));
            
            if (newValue !== oldValue) {
                product.sold = newValue;
                addToHistory('Actualizare vânzări', product.name, oldValue, newValue);
                renderTable();
                updateStats();
            }
        }

        // Săptămână nouă
        function newWeek() {
            if (confirm('Ești sigur că vrei să începi o săptămână nouă? Toate vânzările vor fi resetate.')) {
                products.forEach(product => {
                    if (product.sold > 0) {
                        addToHistory('Reset săptămână', product.name, product.sold, 0);
                        product.sold = 0;
                    }
                });
                
                addToHistory('Sistem', 'Săptămână nouă', '', getCurrentWeek().text);
                renderTable();
                updateStats();
            }
        }

        // Export PDF
        async function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const pdf = new jsPDF();
            
            // Header
            pdf.setFontSize(20);
            pdf.text('Raport Inventar Bar', 20, 30);
            
            pdf.setFontSize(12);
            pdf.text(`Săptămâna: ${getCurrentWeek().text}`, 20, 45);
            
            // Statistici
            const totalRevenue = products.reduce((sum, p) => sum + (p.sold * p.price), 0);
            const totalSold = products.reduce((sum, p) => sum + p.sold, 0);
            
            pdf.text(`Venituri totale: ${totalRevenue} lei`, 20, 60);
            pdf.text(`Produse vândute: ${totalSold}`, 20, 70);
            
            // Tabel
            let y = 90;
            pdf.setFontSize(10);
            pdf.text('Produs', 20, y);
            pdf.text('Stoc Initial', 80, y);
            pdf.text('Vandute', 120, y);
            pdf.text('Stoc Final', 150, y);
            pdf.text('Venituri', 180, y);
            
            y += 10;
            products.forEach(product => {
                const finalStock = product.initialStock - product.sold;
                const revenue = product.sold * product.price;
                
                pdf.text(product.name, 20, y);
                pdf.text(product.initialStock.toString(), 80, y);
                pdf.text(product.sold.toString(), 120, y);
                pdf.text(finalStock.toString(), 150, y);
                pdf.text(`${revenue} lei`, 180, y);
                
                y += 8;
                if (y > 280) {
                    pdf.addPage();
                    y = 30;
                }
            });
            
            pdf.save(`inventar-bar-${getCurrentWeek().text.replace(/\//g, '-')}.pdf`);
        }

        // Istoric
        function showHistory() {
            const modal = document.getElementById('history-modal');
            const content = document.getElementById('history-content');
            
            content.innerHTML = '';
            
            if (history.length === 0) {
                content.innerHTML = '<p class="text-muted">Nu există istoric de modificări.</p>';
            } else {
                history.forEach(entry => {
                    const div = document.createElement('div');
                    div.className = 'p-3 bg-secondary rounded-lg';
                    div.innerHTML = `
                        <div class="flex justify-between items-start">
                            <div>
                                <div class="font-medium">${entry.action}</div>
                                <div class="text-sm text-muted">${entry.product}</div>
                                ${entry.oldValue !== '' ? `<div class="text-xs text-muted">${entry.oldValue} → ${entry.newValue}</div>` : ''}
                            </div>
                            <div class="text-xs text-muted">${entry.timestamp}</div>
                        </div>
                    `;
                    content.appendChild(div);
                });
            }
            
            modal.classList.add('show');
        }

        function closeHistory() {
            document.getElementById('history-modal').classList.remove('show');
        }

        // Inițializare
        function init() {
            document.getElementById('current-week').textContent = getCurrentWeek().text;
            loadData();
            renderTable();
            updateStats();
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', init);
        
        // Închidere modal la click pe fundal
        document.getElementById('history-modal').addEventListener('click', function(e) {
            if (e.target === this) {
                closeHistory();
            }
        });
    </script>
</body>
</html>
