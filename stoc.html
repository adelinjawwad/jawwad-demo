<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inventar Bar - Sistem de Gestionare</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #f1f5f9;
        }
        .card {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            border: 1px solid #475569;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
        }
        .btn-primary {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.4);
        }
        .btn-secondary {
            background: linear-gradient(135deg, #64748b 0%, #475569 100%);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 8px;
            cursor: pointer;
        }
        .input-field {
            background: #334155;
            border: 1px solid #475569;
            color: #f1f5f9;
            padding: 8px 12px;
            border-radius: 6px;
            width: 100%;
        }
        .tab-active {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: white;
        }
        .tab-inactive {
            background: #475569;
            color: #cbd5e1;
        }
        .badge-critical { background: #ef4444; color: white; }
        .badge-low { background: #f59e0b; color: white; }
        .badge-ok { background: #10b981; color: white; }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
        }
        .modal-content {
            background: linear-gradient(135deg, #1e293b 0%, #334155 100%);
            margin: 5% auto;
            padding: 20px;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
        }
        @media print {
            body { background: white !important; color: black !important; }
            .card { background: white !important; border: 1px solid #ccc !important; }
            .no-print { display: none !important; }
        }
    </style>
</head>
<body class="min-h-screen p-4">
    <div class="max-w-7xl mx-auto">
        <!-- Header -->
        <div class="mb-8 text-center">
            <h1 class="text-4xl font-bold mb-2 bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">
                Inventar Bar
            </h1>
            <p class="text-slate-400">Sistem automat de gestionare stoc săptămânal</p>
            <div class="mt-4 text-sm text-slate-500" id="currentWeek"></div>
        </div>

        <!-- Action Buttons -->
        <div class="mb-6 flex flex-wrap gap-4 justify-center no-print">
            <button class="btn-primary" onclick="exportToPDF()">📄 Export PDF</button>
            <button class="btn-secondary" onclick="showWeeklyHistory()">📊 Istoric Săptămâni</button>
            <button class="btn-secondary" onclick="showModificationHistory()">📝 Istoric Modificări</button>
            <button class="btn-danger" onclick="startNewWeek()">🔄 Săptămână Nouă</button>
        </div>

        <!-- Statistics Cards -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-8">
            <div class="card p-6">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-medium text-slate-400">Valoare Stoc</h3>
                    <span class="text-2xl">💰</span>
                </div>
                <div class="text-2xl font-bold text-green-400" id="totalValue">0 lei</div>
                <p class="text-xs text-slate-500">valoare totală</p>
            </div>
            
            <div class="card p-6">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-medium text-slate-400">Produse în Stoc</h3>
                    <span class="text-2xl">📦</span>
                </div>
                <div class="text-2xl font-bold text-blue-400" id="totalProducts">0</div>
                <p class="text-xs text-slate-500">bucăți totale</p>
            </div>
            
            <div class="card p-6">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-medium text-slate-400">Intrări Marfă</h3>
                    <span class="text-2xl">📈</span>
                </div>
                <div class="text-2xl font-bold text-purple-400" id="totalEntries">0</div>
                <p class="text-xs text-slate-500">bucăți adăugate</p>
            </div>
            
            <div class="card p-6">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-sm font-medium text-slate-400">Stoc Scăzut</h3>
                    <span class="text-2xl">⚠️</span>
                </div>
                <div class="text-2xl font-bold text-red-400" id="lowStockCount">0</div>
                <p class="text-xs text-slate-500">produse critice</p>
            </div>
        </div>

        <!-- Low Stock Alerts -->
        <div id="lowStockAlerts" class="mb-8"></div>

        <!-- Stock Entries Section -->
        <div class="card p-6 mb-8">
            <h2 class="text-xl font-bold mb-4 text-blue-400">📦 Intrări Marfă</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4" id="stockEntries"></div>
        </div>

        <!-- Inventory Management -->
        <div class="card p-6 mb-8">
            <h2 class="text-xl font-bold mb-4 text-green-400">📋 Gestionare Inventar</h2>
            <div id="inventoryContent"></div>
        </div>
    </div>

    <!-- Weekly History Modal -->
    <div id="weeklyHistoryModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-blue-400">📊 Istoric Săptămâni</h2>
                <button class="btn-secondary" onclick="closeModal('weeklyHistoryModal')">✕</button>
            </div>
            <div id="weeklyHistoryContent"></div>
        </div>
    </div>

    <!-- Modification History Modal -->
    <div id="modificationHistoryModal" class="modal">
        <div class="modal-content">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold text-purple-400">📝 Istoric Modificări</h2>
                <button class="btn-secondary" onclick="closeModal('modificationHistoryModal')">✕</button>
            </div>
            <div id="modificationHistoryContent"></div>
        </div>
    </div>

    <script>
        // Initial products data
        const initialProducts = [
            { id: "1", name: "Fanta struguri", initialStock: 21, finalStock: 21, price: 9, category: "bauturi_racoritoare" },
            { id: "2", name: "Cola zero", initialStock: 46, finalStock: 46, price: 9, category: "bauturi_racoritoare" },
            { id: "3", name: "Schw. bitter", initialStock: 33, finalStock: 33, price: 9, category: "bauturi_racoritoare" },
            { id: "4", name: "Schw. kinly", initialStock: 33, finalStock: 33, price: 9, category: "bauturi_racoritoare" },
            { id: "5", name: "Schw. mand.", initialStock: 19, finalStock: 19, price: 9, category: "bauturi_racoritoare" },
            { id: "6", name: "Schw. pink", initialStock: 5, finalStock: 29, price: 9, category: "bauturi_racoritoare" },
            { id: "7", name: "Fanta", initialStock: 4, finalStock: 4, price: 9, category: "bauturi_racoritoare" },
            { id: "8", name: "Sprite", initialStock: 3, finalStock: 3, price: 9, category: "bauturi_racoritoare" },
            { id: "9", name: "Cola", initialStock: 56, finalStock: 56, price: 9, category: "bauturi_racoritoare" },
            { id: "10", name: "Apă minerală", initialStock: 24, finalStock: 54, price: 9, category: "apa" },
            { id: "11", name: "Apă plată", initialStock: 24, finalStock: 99, price: 9, category: "apa" },
            { id: "12", name: "Ursus nefiltrat", initialStock: 6, finalStock: 6, price: 9, category: "bere" },
            { id: "13", name: "Kozel dark", initialStock: 6, finalStock: 6, price: 10, category: "bere" },
            { id: "14", name: "Kozel premium", initialStock: 6, finalStock: 6, price: 10, category: "bere" },
            { id: "15", name: "Ursus premium", initialStock: 17, finalStock: 17, price: 9, category: "bere" },
            { id: "16", name: "Ursus FA", initialStock: 9, finalStock: 9, price: 9, category: "bere" },
            { id: "17", name: "Peroni Capri", initialStock: 4, finalStock: 4, price: 9, category: "bere" },
            { id: "18", name: "Ursus Cooler", initialStock: 3, finalStock: 3, price: 9, category: "bere" },
            { id: "19", name: "Corona", initialStock: 17, finalStock: 17, price: 9, category: "bere" },
            { id: "20", name: "Santal", initialStock: 2, finalStock: 2, price: 9, category: "bauturi_racoritoare" },
            { id: "21", name: "Redbull", initialStock: 9, finalStock: 9, price: 11, category: "energizante" },
            { id: "22", name: "Figa", initialStock: 9, finalStock: 9, price: 11, category: "energizante" }
        ];

        let products = [];
        let weeklyHistory = [];
        let modificationHistory = [];

        // Initialize app
        function init() {
            loadData();
            updateCurrentWeek();
            renderInventory();
            renderStockEntries();
            updateStatistics();
            updateLowStockAlerts();
        }

        // Load data from localStorage
        function loadData() {
            const savedProducts = localStorage.getItem('barInventoryProducts');
            const savedWeeklyHistory = localStorage.getItem('barInventoryWeeklyHistory');
            const savedModificationHistory = localStorage.getItem('barInventoryModificationHistory');
            
            products = savedProducts ? JSON.parse(savedProducts) : [...initialProducts];
            weeklyHistory = savedWeeklyHistory ? JSON.parse(savedWeeklyHistory) : [];
            modificationHistory = savedModificationHistory ? JSON.parse(savedModificationHistory) : [];
        }

        // Save data to localStorage
        function saveData() {
            localStorage.setItem('barInventoryProducts', JSON.stringify(products));
            localStorage.setItem('barInventoryWeeklyHistory', JSON.stringify(weeklyHistory));
            localStorage.setItem('barInventoryModificationHistory', JSON.stringify(modificationHistory));
        }

        // Add modification to history
        function addModification(type, productName, details) {
            const modification = {
                id: Date.now(),
                timestamp: new Date().toLocaleString('ro-RO'),
                type: type,
                productName: productName,
                details: details
            };
            modificationHistory.unshift(modification);
            
            // Keep only last 100 modifications
            if (modificationHistory.length > 100) {
                modificationHistory = modificationHistory.slice(0, 100);
            }
            
            saveData();
        }

        // Update current week display
        function updateCurrentWeek() {
            const now = new Date();
            const startOfWeek = new Date(now);
            startOfWeek.setDate(now.getDate() - now.getDay()); // Sunday
            const endOfWeek = new Date(startOfWeek);
            endOfWeek.setDate(startOfWeek.getDate() + 6); // Saturday
            
            document.getElementById('currentWeek').textContent = 
                `Săptămâna curentă: ${startOfWeek.toLocaleDateString('ro-RO')} - ${endOfWeek.toLocaleDateString('ro-RO')}`;
        }

        // Get category name in Romanian
        function getCategoryName(category) {
            const names = {
                'bauturi_racoritoare': 'Băuturi răcoritoare',
                'bere': 'Bere',
                'energizante': 'Energizante',
                'apa': 'Apă'
            };
            return names[category] || category;
        }

        // Get stock status
        function getStockStatus(stock) {
            if (stock <= 3) return { class: 'badge-critical', text: 'Critic' };
            if (stock <= 5) return { class: 'badge-low', text: 'Scăzut' };
            return { class: 'badge-ok', text: 'OK' };
        }

        // Update statistics
        function updateStatistics() {
            const totalValue = products.reduce((sum, p) => sum + (p.finalStock * p.price), 0);
            const totalProducts = products.reduce((sum, p) => sum + p.finalStock, 0);
            const totalEntries = products.reduce((sum, p) => sum + Math.max(0, p.finalStock - p.initialStock), 0);
            const lowStockCount = products.filter(p => p.finalStock <= 5).length;

            document.getElementById('totalValue').textContent = `${totalValue} lei`;
            document.getElementById('totalProducts').textContent = totalProducts;
            document.getElementById('totalEntries').textContent = totalEntries;
            document.getElementById('lowStockCount').textContent = lowStockCount;
        }

        // Update low stock alerts
        function updateLowStockAlerts() {
            const lowStockProducts = products.filter(p => p.finalStock <= 5);
            const alertsContainer = document.getElementById('lowStockAlerts');
            
            if (lowStockProducts.length === 0) {
                alertsContainer.innerHTML = '';
                return;
            }

            alertsContainer.innerHTML = `
                <div class="card p-6">
                    <h2 class="text-xl font-bold mb-4 text-red-400 flex items-center gap-2">
                        ⚠️ Alerte Stoc Scăzut
                    </h2>
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                        ${lowStockProducts.map(product => {
                            const status = getStockStatus(product.finalStock);
                            return `
                                <div class="flex items-center justify-between p-3 border border-slate-600 rounded-lg">
                                    <div>
                                        <p class="font-medium">${product.name}</p>
                                        <p class="text-sm text-slate-400">${getCategoryName(product.category)}</p>
                                    </div>
                                    <span class="px-2 py-1 rounded text-xs font-bold ${status.class}">
                                        ${product.finalStock} buc
                                    </span>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>
            `;
        }

        // Render stock entries section
        function renderStockEntries() {
            const container = document.getElementById('stockEntries');
            const categories = [...new Set(products.map(p => p.category))];
            
            container.innerHTML = categories.map(category => {
                const categoryProducts = products.filter(p => p.category === category);
                return `
                    <div class="border border-slate-600 rounded-lg p-4">
                        <h3 class="font-bold mb-3 text-blue-300">${getCategoryName(category)}</h3>
                        <div class="space-y-2">
                            ${categoryProducts.map(product => `
                                <div class="flex items-center justify-between text-sm">
                                    <span class="flex-1">${product.name}</span>
                                    <div class="flex items-center gap-2">
                                        <button class="btn-secondary text-xs px-2 py-1" onclick="addStockEntry('${product.id}', 5)">+5</button>
                                        <button class="btn-secondary text-xs px-2 py-1" onclick="addStockEntry('${product.id}', 10)">+10</button>
                                        <button class="btn-secondary text-xs px-2 py-1" onclick="addStockEntry('${product.id}', 24)">+24</button>
                                        <input type="number" class="input-field text-xs w-16" placeholder="0" 
                                               onchange="addStockEntry('${product.id}', parseInt(this.value) || 0); this.value=''">
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Add stock entry
        function addStockEntry(productId, amount) {
            if (amount <= 0) return;
            
            const product = products.find(p => p.id === productId);
            if (product) {
                product.finalStock += amount;
                addModification('Intrare marfă', product.name, `+${amount} bucăți`);
                saveData();
                renderInventory();
                renderStockEntries();
                updateStatistics();
                updateLowStockAlerts();
            }
        }

        // Render inventory
        function renderInventory() {
            const container = document.getElementById('inventoryContent');
            const categories = [...new Set(products.map(p => p.category))];
            
            container.innerHTML = categories.map(category => {
                const categoryProducts = products.filter(p => p.category === category);
                return `
                    <div class="mb-8">
                        <h3 class="text-lg font-semibold mb-4 text-green-300">${getCategoryName(category)}</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                            ${categoryProducts.map(product => {
                                const status = getStockStatus(product.finalStock);
                                return `
                                    <div class="border border-slate-600 rounded-lg p-4">
                                        <div class="flex items-center justify-between mb-3">
                                            <h4 class="font-medium">${product.name}</h4>
                                            <span class="px-2 py-1 rounded text-xs font-bold ${status.class}">
                                                ${status.text}
                                            </span>
                                        </div>
                                        <div class="space-y-2 text-sm text-slate-400">
                                            <div class="flex justify-between">
                                                <span>Stoc inițial:</span>
                                                <input type="number" class="input-field text-xs w-16 text-right" 
                                                       value="${product.initialStock}"
                                                       onchange="updateInitialStock('${product.id}', parseInt(this.value) || 0)">
                                            </div>
                                            <div class="flex justify-between">
                                                <span>Stoc final:</span>
                                                <input type="number" class="input-field text-xs w-16 text-right" 
                                                       value="${product.finalStock}"
                                                       onchange="updateFinalStock('${product.id}', parseInt(this.value) || 0)">
                                            </div>
                                            <div class="flex justify-between">
                                                <span>Preț:</span>
                                                <span class="font-medium">${product.price} lei</span>
                                            </div>
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Update initial stock
        function updateInitialStock(productId, newStock) {
            const product = products.find(p => p.id === productId);
            if (product && product.initialStock !== newStock) {
                const oldStock = product.initialStock;
                product.initialStock = newStock;
                addModification('Modificare stoc inițial', product.name, `${oldStock} → ${newStock}`);
                saveData();
                updateStatistics();
            }
        }

        // Update final stock
        function updateFinalStock(productId, newStock) {
            const product = products.find(p => p.id === productId);
            if (product && product.finalStock !== newStock) {
                const oldStock = product.finalStock;
                product.finalStock = newStock;
                addModification('Modificare stoc final', product.name, `${oldStock} → ${newStock}`);
                saveData();
                updateStatistics();
                updateLowStockAlerts();
            }
        }

        // Start new week
        function startNewWeek() {
            if (confirm('Ești sigur că vrei să începi o săptămână nouă? Datele curente vor fi arhivate.')) {
                // Archive current week
                const weekData = {
                    id: Date.now(),
                    startDate: new Date().toLocaleDateString('ro-RO'),
                    products: JSON.parse(JSON.stringify(products)),
                    totalValue: products.reduce((sum, p) => sum + (p.finalStock * p.price), 0),
                    totalProducts: products.reduce((sum, p) => sum + p.finalStock, 0)
                };
                
                weeklyHistory.unshift(weekData);
                
                // Keep only last 12 weeks
                if (weeklyHistory.length > 12) {
                    weeklyHistory = weeklyHistory.slice(0, 12);
                }
                
                // Reset for new week - final stock becomes initial stock
                products.forEach(product => {
                    product.initialStock = product.finalStock;
                });
                
                addModification('Săptămână nouă', 'Sistem', 'Săptămână arhivată și resetată');
                saveData();
                updateCurrentWeek();
                renderInventory();
                renderStockEntries();
                updateStatistics();
                updateLowStockAlerts();
                
                alert('Săptămâna nouă a fost inițializată cu succes!');
            }
        }

        // Show weekly history
        function showWeeklyHistory() {
            const content = document.getElementById('weeklyHistoryContent');
            
            if (weeklyHistory.length === 0) {
                content.innerHTML = '<p class="text-slate-400">Nu există istoric de săptămâni.</p>';
            } else {
                content.innerHTML = `
                    <div class="space-y-4">
                        ${weeklyHistory.map(week => `
                            <div class="border border-slate-600 rounded-lg p-4">
                                <div class="flex justify-between items-center mb-2">
                                    <h3 class="font-bold">Săptămâna din ${week.startDate}</h3>
                                    <div class="text-sm text-slate-400">
                                        ${week.totalProducts} produse • ${week.totalValue} lei
                                    </div>
                                </div>
                                <div class="grid grid-cols-2 md:grid-cols-4 gap-2 text-xs">
                                    ${week.products.slice(0, 8).map(product => `
                                        <div class="text-slate-300">
                                            ${product.name}: ${product.finalStock}
                                        </div>
                                    `).join('')}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            document.getElementById('weeklyHistoryModal').style.display = 'block';
        }

        // Show modification history
        function showModificationHistory() {
            const content = document.getElementById('modificationHistoryContent');
            
            if (modificationHistory.length === 0) {
                content.innerHTML = '<p class="text-slate-400">Nu există istoric de modificări.</p>';
            } else {
                content.innerHTML = `
                    <div class="space-y-2 max-h-96 overflow-y-auto">
                        ${modificationHistory.map(mod => `
                            <div class="border border-slate-600 rounded p-3 text-sm">
                                <div class="flex justify-between items-start mb-1">
                                    <span class="font-medium text-blue-300">${mod.type}</span>
                                    <span class="text-xs text-slate-500">${mod.timestamp}</span>
                                </div>
                                <div class="text-slate-300">${mod.productName}</div>
                                <div class="text-slate-400 text-xs">${mod.details}</div>
                            </div>
                        `).join('')}
                    </div>
                `;
            }
            
            document.getElementById('modificationHistoryModal').style.display = 'block';
        }

        // Close modal
        function closeModal(modalId) {
            document.getElementById(modalId).style.display = 'none';
        }

        // Export to PDF
        function exportToPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            // Title
            doc.setFontSize(20);
            doc.text('Inventar Bar - Raport Săptămânal', 20, 20);
            
            // Date
            doc.setFontSize(12);
            doc.text(`Data: ${new Date().toLocaleDateString('ro-RO')}`, 20, 35);
            
            // Statistics
            const totalValue = products.reduce((sum, p) => sum + (p.finalStock * p.price), 0);
            const totalProducts = products.reduce((sum, p) => sum + p.finalStock, 0);
            
            doc.text(`Valoare totală stoc: ${totalValue} lei`, 20, 50);
            doc.text(`Produse în stoc: ${totalProducts} bucăți`, 20, 60);
            
            // Products table
            let yPos = 80;
            doc.setFontSize(14);
            doc.text('Inventar Produse:', 20, yPos);
            yPos += 10;
            
            doc.setFontSize(10);
            doc.text('Produs', 20, yPos);
            doc.text('Stoc Inițial', 80, yPos);
            doc.text('Stoc Final', 120, yPos);
            doc.text('Preț', 160, yPos);
            doc.text('Valoare', 180, yPos);
            yPos += 10;
            
            products.forEach(product => {
                if (yPos > 270) {
                    doc.addPage();
                    yPos = 20;
                }
                
                doc.text(product.name.substring(0, 20), 20, yPos);
                doc.text(product.initialStock.toString(), 80, yPos);
                doc.text(product.finalStock.toString(), 120, yPos);
                doc.text(`${product.price} lei`, 160, yPos);
                doc.text(`${product.finalStock * product.price} lei`, 180, yPos);
                yPos += 8;
            });
            
            doc.save(`inventar-bar-${new Date().toISOString().split('T')[0]}.pdf`);
        }

        // Close modals when clicking outside
        window.onclick = function(event) {
            const modals = document.querySelectorAll('.modal');
            modals.forEach(modal => {
                if (event.target === modal) {
                    modal.style.display = 'none';
                }
            });
        }

        // Initialize app when page loads
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
