<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Panel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Preload critical resources -->
  <link rel="preload" href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" as="style">
  <link rel="preload" href="assets/css/admin.css?v=1.3" as="style">
  
  <!-- Critical CSS -->
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
  <link href="assets/css/admin.css?v=1.3" rel="stylesheet">
  
  <!-- Non-critical CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gradient-to-br from-gray-900 via-gray-800 to-gray-900 text-white p-6 min-h-screen flex flex-col">
  <!-- Login Screen -->
  <div id="loginScreen" class="fixed inset-0 bg-gradient-to-tr from-gray-900 to-gray-800 flex items-center justify-center z-50 px-4 animate-fadeIn">
    <div class="backdrop-blur-sm bg-gray-800/70 border border-gray-700 shadow-2xl rounded-2xl p-8 w-full max-w-sm text-center animate-scaleUp">
      <h2 class="text-3xl font-bold text-white mb-6 tracking-wide">Admin Login</h2>
      <input
        type="password"
        id="adminPassword"
        placeholder="Enter password"
        class="w-full px-4 py-3 rounded-lg bg-gray-700 text-white placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-pink-500 transition-all duration-200 mb-5"
        onkeypress="if(event.key==='Enter') checkPassword()"
      />
      <button
        onclick="checkPassword()"
        class="w-full bg-pink-600 hover:bg-pink-700 text-white py-3 rounded-lg font-semibold tracking-wide shadow-md hover:shadow-pink-600/40 transition duration-300"
      >
        Login
      </button>
      <p id="loginError" class="text-red-400 mt-4 hidden font-medium">Incorrect password!</p>
    </div>
  </div>

  <!-- Admin Topbar -->
  <div id="adminTopbar" class="hidden animate-slideDown mb-8 flex justify-between items-center bg-gradient-to-r from-gray-800 via-gray-900 to-gray-800/90 p-4 rounded-xl shadow-2xl border border-gray-700 backdrop-blur-sm text-white">
    <span class="text-green-400 font-semibold text-lg flex items-center space-x-2">
      <i class="fas fa-user-shield text-2xl"></i>
      <span>Logged in as Admin</span>
    </span>
    <button onclick="logout()" class="bg-red-600 hover:bg-red-700 px-4 py-2 flex items-center gap-2 rounded-lg shadow-md hover:shadow-red-700/40 transition duration-300">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </button>
  </div>

  <!-- Toast notification -->
  <div id="admin-toast" class="toast-box hidden">
    <i class="icon fas"></i>
    <span id="admin-toast-message"></span>
  </div>

  <!-- File toggle button -->
  <button id="toggle-table-btn" class="mb-6 bg-gray-800 hover:bg-gray-700 text-white px-5 py-3 shadow-md transition duration-300">
    📁 Afișează fișiere
  </button>

  <!-- File table wrapper -->
  <div id="table-wrapper" class="max-h-0 overflow-hidden transition-all duration-700 ease-in-out shadow-lg border border-gray-700">
    <table id="downloads-table" class="w-full text-sm text-left text-white overflow-hidden">
      <thead class="bg-gray-800 text-gray-300 uppercase text-xs tracking-wide">
        <tr>
          <th class="px-6 py-4 border-b border-gray-700">Fișier</th>
          <th class="px-6 py-4 border-b border-gray-700">Acțiuni</th>
        </tr>
      </thead>
      <tbody id="downloads-list" class="divide-y divide-gray-700 bg-gray-900"></tbody>
    </table>
  </div>

  <!-- Main admin content -->
  <h1 class="text-4xl font-extrabold mt-10 mb-8 tracking-tight text-pink-500 drop-shadow-lg">Admin Panel</h1>

  <!-- Category selection -->
  <label for="categorySelect" class="block mb-3 font-semibold text-lg">Select Category:</label>
  <select id="categorySelect" onchange="showRelevantFields()" class="bg-gray-800 text-white p-3 mb-6 w-full max-w-xs focus:outline-none focus:ring-2 focus:ring-pink-500">
    <option value="">-- Select --</option>
    <option value="costumes">Costumes</option>
    <option value="hairstyles">Hairstyles</option>
    <option value="weapons">Weapons</option>
    <option value="others">Others</option>
    <option value="free">Free Stuff</option>
    <option value="tutorials">Tutorials</option>
    <option value="tools">Tools</option>
  </select>

  <button onclick="loadItems()" class="bg-pink-600 hover:bg-pink-700 px-6 py-3 mb-10 font-semibold shadow-lg transition duration-300">
    Load Items
  </button>

  <!-- Items container -->
  <div id="itemsContainer" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6"></div>
  <p id="itemsCount" class="text-gray-400 mt-3 mb-10 text-sm italic"></p>

  <hr class="my-10 border-gray-700">

  <!-- Add/Edit form -->
  <h2 class="text-3xl font-bold mb-6 tracking-wide text-pink-500">Add / Edit Item</h2>
  
  <input id="newTitle" placeholder="Title" class="w-full mb-4 p-3 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-pink-500" />

  <!-- Free fields -->
  <div id="freeFields" class="hidden mb-4">
    <textarea id="newFreeDesc" placeholder="Description / Password / Preview link (pentru free)" class="w-full p-3 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-pink-500"></textarea>
  </div>

  <!-- Shared fields -->
  <div id="sharedFields" class="hidden mb-4">
    <input id="newDownload" placeholder="Download Link (opțional)" class="w-full mb-3 p-3 bg-gray-800 text-white" />
    <input id="newImg" placeholder="Image URL" class="w-full mb-3 p-3 bg-gray-800 text-white" />
    <input id="newFull" placeholder="Full Image URL" class="w-full mb-3 p-3 bg-gray-800 text-white" />
    <input id="newPrice" placeholder="Price (opțional)" class="w-full mb-3 p-3 bg-gray-800 text-white" />
    <input id="newPreview" placeholder="Preview Link (opțional)" class="w-full p-3 bg-gray-800 text-white" />
  </div>

  <!-- Tutorial fields -->
  <div id="tutorialFields" class="hidden mb-4">
    <input id="newYoutube" placeholder="YouTube Video ID" class="w-full mb-3 p-3 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-pink-500" />
    <textarea id="newTutorialDesc" placeholder="Description / Password (optional)" class="w-full p-3 bg-gray-800 text-white focus:outline-none focus:ring-2 focus:ring-pink-500"></textarea>
  </div>

  <!-- Tools fields -->
  <div id="toolsFields" class="hidden mb-4">
    <textarea id="newDesc" placeholder="Description" class="w-full mb-3 p-3 bg-gray-800 text-white"></textarea>
  </div>

  <!-- Action buttons -->
  <div class="flex space-x-4">
    <button onclick="addItem()" class="bg-green-600 hover:bg-green-700 px-6 py-3 font-semibold shadow-md transition duration-300">
      Add Item
    </button>
    <button onclick="clearInputs()" class="bg-gray-600 hover:bg-gray-700 px-6 py-3 font-semibold shadow-md transition duration-300">
      Clear
    </button>
  </div>

  <hr class="my-10 border-gray-700" />

  <!-- Save button -->
  <button onclick="saveData()" class="bg-blue-600 hover:bg-blue-700 px-8 py-4 font-bold shadow-lg transition duration-300">
    💾 Save and Download JSON
  </button>

  <!-- Main script -->
  <script src="assets/js/admin.min.js?v=1.3"></script>
</body>
</html>
